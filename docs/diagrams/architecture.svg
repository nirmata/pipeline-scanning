<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <rect width="1060" height="700" fill="#ffffff"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1e1e1e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1971c2"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e67700"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2f9e44"/>
    </marker>
  </defs>

  <!-- ── Row 1: Git Repo → CI Workflow ──────────────────────────── -->
  <rect x="20" y="30" width="160" height="52" rx="8" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="100" y="52" text-anchor="middle" font-weight="600">Git Repository</text>
  <text x="100" y="69" text-anchor="middle" font-size="11" fill="#555">(GitHub / GitLab)</text>

  <line x1="180" y1="56" x2="218" y2="56" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="199" y="48" text-anchor="middle" font-size="10" fill="#555">push/PR</text>

  <rect x="220" y="30" width="170" height="52" rx="8" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="305" y="52" text-anchor="middle" font-weight="600">CI Workflow</text>
  <text x="305" y="69" text-anchor="middle" font-size="11" fill="#555">(GHA / GitLab CI)</text>

  <!-- CI Workflow → NCH (top-right, same row) -->
  <line x1="390" y1="56" x2="598" y2="56" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="494" y="47" text-anchor="middle" font-size="10" fill="#555">nctl scan repository</text>
  <text x="494" y="59" text-anchor="middle" font-size="10" fill="#555">+ publish findings</text>

  <rect x="600" y="30" width="200" height="52" rx="8" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="700" y="51" text-anchor="middle" font-weight="600">Nirmata Control Hub</text>
  <text x="700" y="68" text-anchor="middle" font-size="11" fill="#555">(NCH)</text>

  <!-- NCH auto-skip note -->
  <rect x="598" y="96" width="204" height="30" rx="4" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="700" y="116" text-anchor="middle" font-size="11" fill="#555">✓ Approved PERs auto-skip violations</text>

  <!-- ── CI Workflow → Job Summary ────────────────────────────── -->
  <line x1="305" y1="82" x2="305" y2="130" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Job Summary box -->
  <rect x="100" y="132" width="410" height="76" rx="8" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
  <text x="305" y="154" text-anchor="middle" font-weight="600">Job Summary / Pipeline Output</text>
  <text x="305" y="171" text-anchor="middle" font-size="12" fill="#555">violations table</text>
  <rect x="122" y="179" width="150" height="20" rx="4" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="197" y="193" text-anchor="middle" font-size="11" fill="#1971c2">🛠️ Fix a violation</text>
  <rect x="290" y="179" width="168" height="20" rx="4" fill="#fff4e6" stroke="#e67700" stroke-width="1.5"/>
  <text x="374" y="193" text-anchor="middle" font-size="11" fill="#e67700">📋 File an Exception</text>

  <!-- Fix path arrow (left-down) -->
  <line x1="197" y1="200" x2="170" y2="258" stroke="#1971c2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="152" y="236" text-anchor="middle" font-size="10" fill="#1971c2">click Fix</text>

  <!-- Exception path arrow (right-down) -->
  <line x1="374" y1="200" x2="374" y2="258" stroke="#e67700" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- ── Fix path ────────────────────────────────────────────── -->
  <!-- Install Remediator -->
  <rect x="60" y="260" width="220" height="52" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="170" y="281" text-anchor="middle" font-weight="600" fill="#1971c2">Install Remediator</text>
  <text x="170" y="298" text-anchor="middle" font-size="11" fill="#555">workflow_dispatch</text>

  <line x1="170" y1="312" x2="170" y2="352" stroke="#1971c2" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- kind cluster -->
  <rect x="30" y="354" width="280" height="48" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="170" y="374" text-anchor="middle" font-weight="600" fill="#1971c2">Ephemeral kind cluster</text>
  <text x="170" y="390" text-anchor="middle" font-size="11" fill="#555">(GHA) or long-lived cluster</text>

  <line x1="170" y1="402" x2="170" y2="442" stroke="#1971c2" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Remediator Agent -->
  <rect x="50" y="444" width="240" height="48" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="170" y="465" text-anchor="middle" font-weight="600" fill="#1971c2">Remediator Agent</text>
  <text x="170" y="481" text-anchor="middle" font-size="11" fill="#555">reconcile · LLM plan</text>

  <line x1="170" y1="492" x2="170" y2="532" stroke="#1971c2" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Fix PR -->
  <rect x="50" y="534" width="240" height="48" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="170" y="555" text-anchor="middle" font-weight="600" fill="#1971c2">Fix PR in Git Repository</text>
  <text x="170" y="571" text-anchor="middle" font-size="11" fill="#555">@nirmatabot commands</text>

  <!-- ── Exception path ─────────────────────────────────────── -->
  <!-- NCH Exception UI (from File Exception button) -->
  <rect x="290" y="260" width="200" height="52" rx="8" fill="#fff4e6" stroke="#e67700" stroke-width="2"/>
  <text x="390" y="281" text-anchor="middle" font-weight="600" fill="#e67700">NCH Exception</text>
  <text x="390" y="298" text-anchor="middle" font-size="11" fill="#555">Request UI (manual)</text>

  <!-- Both paths converge at PER in NCH -->
  <!-- From Fix PR (right arrow) -->
  <line x1="290" y1="558" x2="520" y2="558" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="404" y="549" text-anchor="middle" font-size="10" fill="#555">@nirmatabot request-exception</text>

  <!-- From NCH Exception UI (down arrow) -->
  <line x1="390" y1="312" x2="390" y2="460" stroke="#e67700" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowOrange)"/>
  <!-- Connecting NCH UI to PER box -->
  <line x1="520" y1="486" x2="520" y2="534" stroke="#e67700" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowOrange)"/>
  <!-- Horizontal to PER -->
  <line x1="390" y1="460" x2="520" y2="460" stroke="#e67700" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="520" y1="460" x2="520" y2="534" stroke="#e67700" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowOrange)"/>

  <!-- PER in NCH box -->
  <rect x="520" y="534" width="260" height="52" rx="8" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
  <text x="650" y="556" text-anchor="middle" font-weight="600">PER in NCH</text>
  <text x="650" y="573" text-anchor="middle" font-size="11" fill="#555">pendingApproval → approved</text>

  <!-- PER approved → auto-skip -->
  <line x1="650" y1="586" x2="650" y2="626" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="695" y="613" font-size="10" fill="#2f9e44">approved</text>

  <!-- Auto-skip box -->
  <rect x="510" y="628" width="280" height="48" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="650" y="649" text-anchor="middle" font-weight="600" fill="#2f9e44">✓ Next scan: violations</text>
  <text x="650" y="666" text-anchor="middle" font-weight="600" fill="#2f9e44">automatically skipped</text>
</svg>
