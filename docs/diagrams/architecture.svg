<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 780" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <rect width="1060" height="780" fill="#ffffff"/>

  <!-- Row 1: Git Repo → CI → NCH -->
  <rect x="20" y="30" width="160" height="52" rx="8" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="100" y="52" text-anchor="middle" font-weight="600">Git Repository</text>
  <text x="100" y="69" text-anchor="middle" font-size="11" fill="#555">(GitHub / GitLab)</text>

  <line x1="180" y1="56" x2="240" y2="56" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="48" text-anchor="middle" font-size="10" fill="#555">push/PR</text>

  <rect x="242" y="30" width="160" height="52" rx="8" fill="#dbe4ff" stroke="#1e1e1e" stroke-width="2"/>
  <text x="322" y="52" text-anchor="middle" font-weight="600">CI Workflow</text>
  <text x="322" y="69" text-anchor="middle" font-size="11" fill="#555">(GHA / GitLab CI)</text>

  <line x1="402" y1="56" x2="464" y2="56" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="433" y="48" text-anchor="middle" font-size="10" fill="#555">nctl scan helm</text>

  <rect x="466" y="30" width="170" height="52" rx="8" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
  <text x="551" y="52" text-anchor="middle" font-weight="600">Nirmata Control Hub</text>
  <text x="551" y="69" text-anchor="middle" font-size="11" fill="#555">(NCH)</text>

  <!-- NCH → Job Summary -->
  <line x1="551" y1="82" x2="551" y2="126" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="563" y="110" font-size="10" fill="#555">findings</text>

  <!-- Job Summary box -->
  <rect x="360" y="128" width="380" height="72" rx="8" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
  <text x="550" y="150" text-anchor="middle" font-weight="600">Job Summary / Pipeline Output</text>
  <text x="550" y="167" text-anchor="middle" font-size="12" fill="#555">violations table</text>
  <rect x="385" y="176" width="150" height="18" rx="4" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
  <text x="460" y="189" text-anchor="middle" font-size="11" fill="#1971c2">🛠️ Fix a violation</text>
  <rect x="552" y="176" width="165" height="18" rx="4" fill="#fff4e6" stroke="#e67700" stroke-width="1"/>
  <text x="634" y="189" text-anchor="middle" font-size="11" fill="#e67700">📋 File an Exception</text>

  <!-- Fix path (left) -->
  <line x1="460" y1="200" x2="320" y2="260" stroke="#1971c2" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrowBlue)"/>
  <text x="364" y="232" text-anchor="middle" font-size="10" fill="#1971c2">click Fix</text>

  <!-- Exception path (right) -->
  <line x1="634" y1="200" x2="790" y2="260" stroke="#e67700" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="732" y="232" text-anchor="middle" font-size="10" fill="#e67700">click File Exception</text>

  <!-- Remediator Workflow box -->
  <rect x="192" y="262" width="256" height="52" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="320" y="284" text-anchor="middle" font-weight="600" fill="#1971c2">Install Remediator Workflow</text>
  <text x="320" y="301" text-anchor="middle" font-size="11" fill="#555">workflow_dispatch</text>

  <!-- NCH Exception UI box -->
  <rect x="700" y="262" width="200" height="52" rx="8" fill="#fff4e6" stroke="#e67700" stroke-width="2"/>
  <text x="800" y="284" text-anchor="middle" font-weight="600" fill="#e67700">NCH Exception</text>
  <text x="800" y="301" text-anchor="middle" font-size="11" fill="#555">Request UI (manual)</text>

  <!-- Remediator WF → Cluster -->
  <line x1="320" y1="314" x2="320" y2="358" stroke="#1971c2" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Cluster box -->
  <rect x="120" y="360" width="400" height="52" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="320" y="382" text-anchor="middle" font-weight="600" fill="#1971c2">Ephemeral kind cluster (GitHub Actions)</text>
  <text x="320" y="399" text-anchor="middle" font-size="11" fill="#555">or long-lived cluster (GitLab / production)</text>

  <!-- Cluster → Agent -->
  <line x1="320" y1="412" x2="320" y2="456" stroke="#1971c2" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Remediator Agent box -->
  <rect x="160" y="458" width="320" height="52" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="320" y="480" text-anchor="middle" font-weight="600" fill="#1971c2">Remediator Agent</text>
  <text x="320" y="497" text-anchor="middle" font-size="11" fill="#555">reconcile · LLM remediation plan</text>

  <!-- Agent → Fix PR -->
  <line x1="320" y1="510" x2="320" y2="554" stroke="#1971c2" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Fix PR box -->
  <rect x="160" y="556" width="320" height="52" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="320" y="578" text-anchor="middle" font-weight="600" fill="#1971c2">Fix PR in Git Repository</text>
  <text x="320" y="595" text-anchor="middle" font-size="11" fill="#555">@nirmatabot commands available</text>

  <!-- Fix PR → PER -->
  <line x1="480" y1="582" x2="598" y2="582" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="539" y="573" text-anchor="middle" font-size="10" fill="#555">request-exception</text>

  <!-- PER box -->
  <rect x="600" y="556" width="240" height="52" rx="8" fill="#fff9db" stroke="#1e1e1e" stroke-width="2"/>
  <text x="720" y="578" text-anchor="middle" font-weight="600">PER in NCH</text>
  <text x="720" y="595" text-anchor="middle" font-size="11" fill="#555">pendingApproval → approved</text>

  <!-- PER → YAML PR (dashed - open issue) -->
  <line x1="720" y1="608" x2="720" y2="648" stroke="#e03131" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="757" y="632" font-size="10" fill="#e03131">approved</text>

  <!-- Warning note -->
  <rect x="598" y="616" width="244" height="20" rx="4" fill="#fff5f5" stroke="#e03131" stroke-width="1"/>
  <text x="720" y="630" text-anchor="middle" font-size="10" fill="#e03131">⚠️ Open issue #418 — not yet implemented</text>

  <!-- YAML PR box (dashed border) -->
  <rect x="570" y="650" width="300" height="52" rx="8" fill="#fff5f5" stroke="#e03131" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="720" y="672" text-anchor="middle" font-weight="600" fill="#e03131">PolicyException YAML PR</text>
  <text x="720" y="689" text-anchor="middle" font-size="11" fill="#555">kyverno-exceptions/&lt;name&gt;.yaml</text>

  <!-- YAML PR → Active -->
  <line x1="720" y1="702" x2="720" y2="740" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="736" y="726" font-size="10" fill="#2f9e44">merge</text>

  <!-- Active box -->
  <rect x="580" y="742" width="280" height="40" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="720" y="767" text-anchor="middle" font-weight="600" fill="#2f9e44">Exception active in next scan</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1e1e1e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1971c2"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e67700"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e03131"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2f9e44"/>
    </marker>
  </defs>
</svg>
