# CRD Chart Configuration
# Set to false to skip CRD installation (useful if managing CRDs separately)
crds:
  install: true

replicaCount: 1

image:
  # Official public image. Previously ghcr.io/nsagark/go-nirmata-agent:helm-mapper-fix,
  # a personal `ko build` of commit 7fd5f44 in a private GHCR package — it required
  # a ghcr-pull-secret whose token had to cover the nsagark namespace.
  #
  # v0.2.9-rc.3 is public and supersedes that build:
  #   * contains the HelmMapper-on-GitLab fix (PR nirmata/go-service-agent#402,
  #     merge commit 7fd5f442) — v0.2.9-rc.3 is 10 commits ahead, 0 behind it
  #   * links go-llm-apps v0.0.46, which has the httpResp == nil guards. Builds
  #     on go-llm-apps < v0.0.45 panic with a nil pointer dereference on any
  #     failed LLM request (defer httpResp.Body.Close() registered before the
  #     error check), which masks the real error and crashes the reconcile.
  repository: ghcr.io/nirmata/go-nirmata-agent
  tag: v0.2.9-rc.3
  pullPolicy: IfNotPresent

# No pull secret: ghcr.io/nirmata/go-nirmata-agent is a public package and pulls
# anonymously. This must stay empty while the image is public — kubelet prefers
# an imagePullSecret over anonymous access, so pointing at a secret whose token
# lacks read:packages makes ghcr.io's token endpoint return 403 and the pull
# fails, where no secret at all would have succeeded. Bad credentials are worse
# than none. Re-add a secret here only alongside a genuinely private image.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

jobConfigurations:
  image:
    # -- (string) Image registry
    registry: ghcr.io
    # -- Image repository
    repository: nirmata/kubectl
    # -- Image tag
    # Defaults to `latest` if omitted
    tag: '1.34.0'
    # -- (string) Image pull policy
    # Defaults to image.pullPolicy if omitted
    pullPolicy: IfNotPresent

  # -- Image pull secrets
  imagePullSecrets: []

  # -- Security context for the pod
  podSecurityContext: {}

  # -- Node labels for pod assignment
  nodeSelector: {}

  # -- List of node taints to tolerate
  tolerations: []

  # -- Pod anti affinity constraints.
  podAntiAffinity: {}

  # -- Pod affinity constraints.
  podAffinity: {}

  # -- Pod labels.
  podLabels: {}

  # -- Pod annotations.
  podAnnotations: {}

  # -- Node affinity constraints.
  nodeAffinity: {}

  # -- Security context for the hook containers
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

serviceAccount:
  create: true
  annotations: {}
  name: ""


resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Logging configuration
logging:
  # Set verbosity level (0=info, 1=audit+info, 2=debug+audit+info)
  verbosity: 0
  # Enable audit logging (if true, overrides verbosity=0 to ensure audit logs are visible)
  enableAudit: false

nodeSelector: {}
tolerations: []
affinity: {}

# Metrics server configuration
metrics:
  port: 8080
  secure: false
  service:
    enabled: true
    name: service-agent-metrics-service
    type: ClusterIP
    port: 8443

# LLM provider configuration for creating an LLMConfig CR
llm:
  enabled: true
  provider: "nirmataAI"  # Options: bedrock, azure-openai
  bedrock:
    model: ""
    region: ""
    secretRef:
      name: ""
      # Optional for some auth methods
      key: "aws_access_key_id"
  azureOpenAI:
    endpoint: ""
    deploymentName: ""
    secretRef:
      name: ""
      # Defaults to standard header key
      key: "api-key"
  nirmataAI:
    # Pin a current model. Left empty, the agent's bundled go-llm-apps v0.0.46
    # falls back to us.anthropic.claude-sonnet-4-20250514-v1:0 (May 2025), which
    # repeatedly emits CUDL patches with context lines after change lines and
    # exhausts all 10 validation retries — no PR ever gets created. Upstream
    # go-llm-apps now defaults to claude-sonnet-5 (also accepts
    # us.anthropic.claude-sonnet-4-6 as a fallback if the service rejects this).
    model: "us.anthropic.claude-sonnet-5"

nirmata:
  # Nirmata endpoint URL - used to set the --url command-line flag.
  # Must be the environment that issued the service-account token below —
  # tokens are environment-specific, and a mismatch fails the JWT exchange
  # ("authentication failed: ... Failed to fetch JWT token"). This default
  # matches the repo's NIRMATA_URL variable used by helm-policy-scan.yml;
  # install-remediator.yml overrides it from that variable when set.
  # (Was https://devtest2.nirmata.co, valid only for tokens minted there.)
  endpoint: "https://nirmata.io"

  # Authentication method selection
  # Options: "serviceAccountToken" or "apiToken"
  # This determines which authentication method will be used
  auth: "serviceAccountToken"

  # Service Account Token configuration
  # Used when auth is set to "serviceAccountToken"
  # The secret must be in the same namespace as the deployment
  # Create manually: kubectl create secret generic nirmata-service-account-token --from-literal=service-account-token=YOUR_TOKEN -n <namespace>
  serviceAccountTokenSecret: "nirmata-service-account-token"

  # Key within the secret containing Nirmata service account token
  # Defaults to "service-account-token"
  serviceAccountTokenSecretKey: "service-account-token"

  # API Token configuration
  # Used when auth is set to "apiToken"
  # The secret must be in the same namespace as the deployment
  # Create manually: kubectl create secret generic nirmata-api-token --from-literal=api-token=YOUR_API_TOKEN -n <namespace>
  apiTokenSecret: ""

  # Key within the secret containing Nirmata API token
  # Defaults to "api-token"
  apiTokenSecretKey: "api-token"

# ToolConfig for GitHub (used by CreatePR to open a Pull Request)
tool:
  enabled: true
  name: github-tool
  type: github

  credentials:
    method: pat

    pat:
      secret:
        name: "github-pat-token"
        key: "token"

  defaults:
    git:
      pullRequests:
        branchPrefix: remediation-

# Remediator CR
remediator:
  enabled: true
  name: nirmata-agent
  environment:
    type: localCluster  # Options: localCluster, argoHub (vcsTarget can be used with any environment type)
  target:
    localCluster:
      repoNamespaceMappingRef:
        name: ""
        namespace: ""
    vcs:
      policies:
        - name: seccomp-policy
          repo: https://github.com/nirmata/pipeline-scanning.git
          path: policies/seccomp
          ref: kyverno-policies
        - name: resource-limits-policy
          repo: https://github.com/nirmata/pipeline-scanning.git
          path: policies/resource-limits
          ref: kyverno-policies
      resources:
        - name: nginx-all-fixes
          repo: https://github.com/nirmata/pipeline-scanning.git
          path: ./
          ref: helm-app
          policyRefs:
            - seccomp-policy
            - resource-limits-policy
  remediation:
    schedule: "0 */6 * * *"
    eventPolling:
      enabled: true
      intervalMinutes: 1
    actions:
      - type: CreatePR
        toolRefName: github-tool

# Agent Configuration
# Deploy a custom Agent resource for autonomous operations
agent:
  # Enable/disable Agent deployment
  enabled: false

  # Agent name (defaults to <release-name>-agent)
  name: ""

  # Custom instruction that defines the agent's behavior and task
  # This is the primary directive that tells the agent what to accomplish
  # Example: "Scan my cluster every 6 hours for policy violations and send a summary email"
  prompt: ""

  # List of additional tool names available to the agent
  # Optional tools that require NCH credentials:
  #   - email: Send email notifications
  #   - send_slack_message: Send messages to Slack
  #   - list_slack_channels: List available Slack channels
  # Example:
  # tools:
  #   - email
  #   - send_slack_message
  tools: []

  # Environment configuration
  environment:
    # Type of environment
    # Options: localCluster, argoHub
    # localCluster: Scan the current cluster where the controller is deployed
    # argoHub: Scan clusters managed by ArgoCD (hub-spoke architecture)
    type: localCluster

  # Target configuration (optional for localCluster, required for argoHub)
  target:
    # LocalCluster target configuration
    # Used when environment.type is localCluster
    localCluster:
      # Reference to ConfigMap containing repo-namespace mappings
      # Required for localCluster remediation workflows
      repoNamespaceMappingRef:
        name: ""           # ConfigMap name
        namespace: ""      # ConfigMap namespace (defaults to release namespace)
        key: "mapping"     # Key within ConfigMap (defaults to "mapping")

    # ArgoHub target configuration
    # Used when environment.type is argoHub
    # Define which clusters and applications to scan
    argoHub:
      # List of cluster names to target (optional)
      # Example:
      # clusterNames:
      #   - prod-cluster-1
      #   - staging-cluster
      clusterNames: []

      # List of cluster server URLs to target (optional)
      # Example:
      # clusterServerUrls:
      #   - https://prod-cluster.example.com
      clusterServerUrls: []

      # Application selector
      # Defines which ArgoCD applications to scan
      appSelector:
        # Select all applications (wildcard)
        # When true, other selector options are ignored
        allApps: false

        # OR select by application names
        # names:
        #   - app-1
        #   - app-2

        # OR select by label selector
        # labelSelector:
        #   matchLabels:
        #     environment: production
        #   matchExpressions:
        #     - key: tier
        #       operator: In
        #       values:
        #         - frontend
        #         - backend

    # VCS (Version Control System) target configuration
    # Can be used with any environment type
    # Define policies and resources from git repositories
    vcs:
      # List of policy repositories
      # Example:
      # policies:
      #   - name: pss-restricted
      #     repo: https://github.com/nirmata/kyverno-policies
      #     path: pod-security/restricted
      #     ref: main
      policies: []

      # List of resource repositories with associated policies
      # Example:
      # resources:
      #   - name: nginx-deployment
      #     repo: https://github.com/myorg/k8s-resources
      #     path: apps/nginx
      #     ref: main
      #     policyRefs:
      #       - pss-restricted
      resources: []

  # Triggers define when the agent should execute
  # At least one trigger is required
  triggers:
    # Schedule-based trigger (cron expression)
    - schedule:
        # Cron expression for scheduling
        # Examples:
        #   "0 9 * * *"      - Daily at 9 AM
        #   "0 */6 * * *"    - Every 6 hours
        #   "0 9 * * MON"    - Weekly on Monday at 9 AM
        #   "*/30 * * * *"   - Every 30 minutes
        crontab: "0 */6 * * *"

  # LLM configuration reference
  # Points to the LLMConfig resource to use for AI operations
  llmConfigRef:
    # API version (optional, defaults to serviceagents.nirmata.io/v1alpha1)
    apiVersion: ""

    # Kind (optional, defaults to LLMConfig)
    kind: ""

    # Name of the LLMConfig resource
    # Defaults to <release-name>-llm if not specified
    name: ""

    # Namespace of the LLMConfig resource
    # Defaults to release namespace if not specified
    namespace: ""
