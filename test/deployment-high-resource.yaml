apiVersion: apps/v1
kind: Deployment
metadata:
  name: high-resource-deployment
  labels:
    app: high-resource
spec:
  replicas: 1
  selector:
    matchLabels:
      app: high-resource
  template:
    metadata:
      labels:
        app: high-resource
    spec:
      containers:
      - name: app
        image: nginx:latest
        resources:
          requests:
            cpu: "10m"
            memory: "10Mi"
          limits:
            cpu: "20"
            memory: "20Gi"
        ports:
        - containerPort: 80
