crds:
  install: true

replicaCount: 1

image:
  repository: ghcr.io/nirmata/go-agent-remediator
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

jobConfigurations:
  image:
    registry: ghcr.io
    repository: nirmata/kubectl
    tag: '1.34.0'
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  podAntiAffinity: {}
  podAffinity: {}
  podLabels: {}
  podAnnotations: {}
  nodeAffinity: {}
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

serviceAccount:
  create: true
  annotations: {}
  name: ""

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

logging:
  verbosity: 2
  enableAudit: true

nodeSelector: {}
tolerations: []
affinity: {}

metrics:
  port: 8080
  secure: false
  service:
    enabled: true
    name: service-agent-metrics-service
    type: ClusterIP
    port: 8443

llm:
  enabled: true
  provider: "nirmataAI"
  bedrock:
    model: ""
    region: ""
    secretRef:
      name: ""
      key: "aws_access_key_id"
  azureOpenAI:
    endpoint: ""
    deploymentName: ""
    secretRef:
      name: ""
      key: "api-key"
  nirmataAI:
    model: ""

nirmata:
  endpoint: "https://nirmata.io"
  auth: "serviceAccountToken"
  serviceAccountTokenSecret: "nirmata-service-account-token"
  serviceAccountTokenSecretKey: "service-account-token"
  apiTokenSecret: ""
  apiTokenSecretKey: "api-token"

tool:
  enabled: true
  name: github-tool
  type: github
  credentials:
    method: pat
    pat:
      secret:
        name: "github-pat-token"
        key: "token"
  defaults:
    git:
      pullRequests:
        branchPrefix: remediation-resource-limits-

# Remediator CR — resource limits violations only
remediator:
  enabled: true
  name: nirmata-agent
  environment:
    type: localCluster
  target:
    localCluster:
      repoNamespaceMappingRef:
        name: ""
        namespace: ""
    vcs:
      policies:
        - name: resource-limits-policy
          repo: https://github.com/nsagark/nginx
          path: policies/resource-limits
          ref: exceptions-in-pipelines
      resources:
        - name: nginx-resource-limits-fix
          repo: https://github.com/nsagark/nginx
          path: ./
          ref: remediation-helm-chart
          policyRefs:
            - resource-limits-policy
  remediation:
    schedule: "*/5 * * * *"
    eventPolling:
      enabled: true
    actions:
      - type: CreatePR
        toolRefName: github-tool

agent:
  enabled: false
  name: ""
  prompt: ""
  tools: []
  environment:
    type: localCluster
  target:
    localCluster:
      repoNamespaceMappingRef:
        name: ""
        namespace: ""
    argoHub:
      clusterNames: []
      clusterServerUrls: []
      appSelector:
        allApps: false
    vcs:
      policies: []
      resources: []
  triggers:
    - schedule:
        crontab: "0 */6 * * *"
  llmConfigRef:
    apiVersion: ""
    kind: ""
    name: ""
    namespace: ""
