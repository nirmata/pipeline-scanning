name: Fix restrict-volume-types

on:
  workflow_dispatch:

jobs:
  fix:
    uses: ./.github/workflows/install-remediator.yml
    with:
      restrict_volume_types: true
    secrets:
      NIRMATA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.NIRMATA_SERVICE_ACCOUNT_TOKEN }}
      PAT: ${{ secrets.PAT }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
