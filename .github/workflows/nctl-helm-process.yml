# Manual workflow — triggered from the GitHub UI via Actions → Run workflow.
# Run the scan workflow first (push to exceptions-in-pipelines) to find violating
# resources, then come here to remediate or generate PolicyExceptions.
#
# Required secrets : NIRMATA_URL, NIRMATA_TOKEN
# Optional secret  : NIRMATA_USERID
# Optional variable: HELM_CHART_PATH (defaults to ".")

name: nctl Helm — process resources

on:
  workflow_dispatch:
    inputs:
      selected_resources:
        description: >
          Pod controller(s) to process — copy from the scan run summary.
          Format: Kind/name  (comma-separated for multiple)
          Example: Deployment/release-name-my-nginx-chart
        required: true
      action:
        description: >
          Action to perform on each selected resource:
          generate-exception → Kyverno PolicyException YAML (namespace: kyverno)
          remediate          → fixed K8s resource YAML with all violations resolved
        required: true
        default: generate-exception
        type: choice
        options:
          - generate-exception
          - remediate
      selected_policies:
        description: >
          (generate-exception only) Comma-separated policy names to include in the PolicyException.
          Leave empty to cover ALL violations for the selected resource(s).
          Copy policy names from the "Policy violations per resource" table in the scan summary.
          Example: disallow-capabilities-strict,require-run-as-nonroot
        required: false
        default: ''

permissions:
  contents: read

env:
  NIRMATA_URL: ${{ secrets.NIRMATA_URL }}
  NIRMATA_TOKEN: ${{ secrets.NIRMATA_TOKEN }}
  POLICY_SETS: pss-baseline,pss-restricted
  CHART_BRANCH: exceptions-in-pipelines
  CHART_PATH: ${{ vars.HELM_CHART_PATH != '' && vars.HELM_CHART_PATH || '.' }}
  POLICYEXCEPTION_DIR: policyexceptions
  REMEDIATION_DIR: remediated

jobs:
  process:
    name: "${{ inputs.action }} — ${{ inputs.selected_resources }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Check out the branch that contains the Helm chart
      - name: Checkout chart branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHART_BRANCH }}
          fetch-depth: 0

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Install nctl
        run: |
          set -euo pipefail
          curl -fsSL https://downloads.nirmata.io/nctl/install.sh | bash
          echo "$(dirname "$(command -v nctl)")" >> "${GITHUB_PATH}"
          nctl version
          nctl ai --help >/dev/null

      - name: Authenticate nctl
        env:
          NIRMATA_USERID: ${{ secrets.NIRMATA_USERID }}
        run: |
          [ -n "${NIRMATA_USERID:-}" ] &&
            nctl login --url "${NIRMATA_URL}" --userid "${NIRMATA_USERID}" --token "${NIRMATA_TOKEN}" ||
            true

      - name: Validate chart path
        run: |
          set -euo pipefail
          [[ -d "${CHART_PATH}" ]] || { echo "::error::HELM_CHART_PATH '${CHART_PATH}' is not a directory"; exit 1; }
          [[ "${CHART_PATH}" == "." && -f nctl.zip ]] && rm -f nctl.zip || true

      # Re-scan to get a fresh report — needed to extract per-resource violations
      - name: Scan Helm chart
        id: scan
        continue-on-error: true
        run: |
          set -euo pipefail
          nctl scan helm -r "${CHART_PATH}" --policy-sets "${POLICY_SETS}" -o json | tee report.json

      - name: Render Helm chart to per-resource YAML files
        run: |
          set -euo pipefail
          mkdir -p rendered-resources
          helm dependency build "${CHART_PATH}" 2>/dev/null || true
          helm template scan-release "${CHART_PATH}" > all-rendered.yaml 2>/dev/null || true

          if [[ -s all-rendered.yaml ]]; then
            python3 << 'PYEOF'
          import yaml, os, re
          os.makedirs("rendered-resources", exist_ok=True)
          with open("all-rendered.yaml") as f:
              docs = list(yaml.safe_load_all(f))
          for doc in docs:
              if not isinstance(doc, dict):
                  continue
              kind = doc.get("kind", "unknown")
              name = doc.get("metadata", {}).get("name", "unknown")
              safe = re.sub(r"[^a-zA-Z0-9_-]", "-", name)
              out  = f"rendered-resources/{kind.lower()}-{safe}.yaml"
              with open(out, "w") as f:
                  yaml.dump(doc, f, default_flow_style=False, allow_unicode=True)
          PYEOF
            echo "Rendered resources:"
            ls rendered-resources/
          else
            echo "::warning::helm template produced no output — nctl ai will work from chart files directly"
          fi

      - name: Process each selected resource
        env:
          SELECTED: ${{ inputs.selected_resources }}
          ACTION: ${{ inputs.action }}
          SELECTED_POLICIES: ${{ inputs.selected_policies }}
        run: |
          set -euo pipefail
          mkdir -p "${POLICYEXCEPTION_DIR}" "${REMEDIATION_DIR}"

          IFS=',' read -ra RESOURCES <<< "${SELECTED}"

          for resource in "${RESOURCES[@]}"; do
            resource="$(echo "${resource}" | xargs)"
            KIND="${resource%%/*}"
            NAME="${resource##*/}"

            echo "::group::▶ ${ACTION}  →  ${KIND}/${NAME}"

            # ── Extract violations, optionally filtered to selected policies ──
            VIOLATIONS="$(jq -r --arg k "${KIND}" --arg n "${NAME}" --arg pf "${SELECTED_POLICIES}" '
              .policies // [] |
              # Filter by selected_policies when provided (comma-separated list)
              if ($pf != "") then
                map(select(
                  .name as $pname |
                  ($pf | split(",") | map(ltrimstr(" ") | rtrimstr(" ")) | index($pname)) != null
                ))
              else . end |
              map(. as $pol |
                (.namespaceScopedResources // []) |
                map(.resources // [] | .[]) | flatten |
                map(select(.name == ($n + " (" + $k + ")"))) |
                map(
                  .rules // [] |
                  map(select(.Status == "fail")) |
                  map("  policy: \($pol.name)\n  rule:   \(.Name)\n  reason: \(.Message)\n")
                ) | flatten
              ) |
              flatten | .[]
            ' report.json 2>/dev/null)"

            if [[ -z "${VIOLATIONS}" ]]; then
              if [[ -n "${SELECTED_POLICIES}" ]]; then
                echo "::warning::No violations matched the selected policies (${SELECTED_POLICIES}) for ${KIND}/${NAME} — skipping"
              else
                echo "::warning::No violations found in report for ${KIND}/${NAME} — skipping"
              fi
              echo "::endgroup::"
              continue
            fi

            echo "Violations:"
            echo "${VIOLATIONS}"

            # ── Locate rendered resource YAML ─────────────────────────────
            RESOURCE_YAML_FILE="rendered-resources/${KIND,,}-${NAME}.yaml"
            if [[ ! -f "${RESOURCE_YAML_FILE}" ]]; then
              RESOURCE_YAML_FILE="$(find rendered-resources/ -iname "*${NAME}*.yaml" 2>/dev/null | head -1 || true)"
            fi

            if [[ -n "${RESOURCE_YAML_FILE}" && -f "${RESOURCE_YAML_FILE}" ]]; then
              RESOURCE_YAML="$(cat "${RESOURCE_YAML_FILE}")"
            else
              echo "::warning::Rendered YAML not found for ${KIND}/${NAME}"
              RESOURCE_YAML="(not available — locate ${KIND}/${NAME} inside ${CHART_PATH})"
            fi

            # ── Build prompt and run nctl ai ──────────────────────────────
            PROMPT_FILE="$(mktemp)"

            if [[ "${ACTION}" == "generate-exception" ]]; then
              OUT_FILE="${POLICYEXCEPTION_DIR}/${KIND,,}-${NAME}-exception.yaml"
              cat > "${PROMPT_FILE}" << EOF
          Task: Generate a Kyverno PolicyException YAML for the resource below.

          ## Resource
          Kind : ${KIND}
          Name : ${NAME}

          ## Rendered Kubernetes YAML
          \`\`\`yaml
          ${RESOURCE_YAML}
          \`\`\`

          ## Policy violations to exempt
          ${VIOLATIONS}

          ## Output spec — follow exactly
          \`\`\`yaml
          apiVersion: kyverno.io/v2beta1
          kind: PolicyException
          metadata:
            name: ${KIND,,}-${NAME}-exception
            namespace: kyverno          # REQUIRED — never change this namespace
          spec:
            match:
              any:
              - resources:
                  kinds:
                  - ${KIND}
                  names:
                  - "${NAME}"
            exceptions:
            - policyName: <policy-name>   # one block per unique policy in the violations
              ruleNames:
              - <rule-name>               # list every failing rule for that policy
          \`\`\`

          Rules:
          - Output a single complete YAML document only — no prose, no markdown fences.
          - Every policy/rule pair from the violations MUST appear in spec.exceptions.
          - metadata.namespace MUST be "kyverno" — never override this.

          Write the file to: ${OUT_FILE}
          EOF

            elif [[ "${ACTION}" == "remediate" ]]; then
              OUT_FILE="${REMEDIATION_DIR}/${KIND,,}-${NAME}.yaml"
              cat > "${PROMPT_FILE}" << EOF
          Task: Fix all Kyverno policy violations in the Kubernetes resource below and output the corrected YAML.

          ## Resource
          Kind : ${KIND}
          Name : ${NAME}

          ## Current Kubernetes YAML
          \`\`\`yaml
          ${RESOURCE_YAML}
          \`\`\`

          ## Violations to fix
          ${VIOLATIONS}

          ## Instructions
          1. For each violation, identify the exact field that is non-compliant.
          2. Change ONLY those fields — do not alter any other configuration.
          3. Common fixes:
             - autogen-require-drop-all            → securityContext.capabilities.drop: [ALL] on every container
             - autogen-privilege-escalation         → securityContext.allowPrivilegeEscalation: false on every container
             - autogen-run-as-non-root              → securityContext.runAsNonRoot: true on pod and containers
             - autogen-check-seccomp-strict         → securityContext.seccompProfile.type: RuntimeDefault on pod and containers
             - disallow-host-namespaces             → set hostPID/hostIPC/hostNetwork to false or remove them
          4. Output a single complete valid Kubernetes YAML — no explanation, no markdown fences.

          Write the fixed YAML to: ${OUT_FILE}
          EOF
            fi

            nctl ai --new-session \
              --allowed-dirs "$(pwd)" \
              --prompt "$(cat "${PROMPT_FILE}")" \
              --skip-permission-checks \
              --force \
              || echo "::warning::nctl ai did not complete successfully for ${KIND}/${NAME}"

            rm -f "${PROMPT_FILE}"
            echo "::endgroup::"
          done

      # Guarantee namespace: kyverno regardless of what nctl ai wrote
      - name: Enforce namespace kyverno in PolicyException YAMLs
        if: inputs.action == 'generate-exception'
        run: |
          find "${POLICYEXCEPTION_DIR}" \( -name "*.yaml" -o -name "*.yml" \) 2>/dev/null | while IFS= read -r f; do
            python3 - "${f}" << 'PYEOF'
          import sys, yaml
          path = sys.argv[1]
          with open(path) as fh:
              docs = list(yaml.safe_load_all(fh))
          changed = False
          for doc in docs:
              if isinstance(doc, dict) and doc.get("kind") == "PolicyException":
                  doc.setdefault("metadata", {})
                  if doc["metadata"].get("namespace") != "kyverno":
                      doc["metadata"]["namespace"] = "kyverno"
                      changed = True
          if changed:
              with open(path, "w") as fh:
                  yaml.dump_all(docs, fh, default_flow_style=False, allow_unicode=True)
              print(f"Enforced namespace: kyverno → {path}")
          PYEOF
          done

      - name: Upload PolicyException artifacts
        if: inputs.action == 'generate-exception'
        uses: actions/upload-artifact@v4
        with:
          name: policyexceptions-${{ github.run_id }}
          path: ${{ env.POLICYEXCEPTION_DIR }}
          if-no-files-found: warn

      - name: Upload remediation artifacts
        if: inputs.action == 'remediate'
        uses: actions/upload-artifact@v4
        with:
          name: remediated-yamls-${{ github.run_id }}
          path: ${{ env.REMEDIATION_DIR }}
          if-no-files-found: warn

      - name: Write summary
        if: always()
        env:
          SELECTED: ${{ inputs.selected_resources }}
          ACTION: ${{ inputs.action }}
          SELECTED_POLICIES: ${{ inputs.selected_policies }}
        run: |
          {
            echo "## Processing Results"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Resources        | \`${SELECTED}\` |"
            echo "| Action           | \`${ACTION}\` |"
            if [[ -n "${SELECTED_POLICIES}" ]]; then
              echo "| Policies scoped  | \`${SELECTED_POLICIES}\` |"
            else
              echo "| Policies scoped  | all violations |"
            fi
            echo "| Chart branch     | \`${CHART_BRANCH}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${ACTION}" == "generate-exception" ]]; then
            COUNT=$(find "${POLICYEXCEPTION_DIR}" \( -name "*.yaml" -o -name "*.yml" \) 2>/dev/null | wc -l | xargs)
            if [[ "${COUNT}" -gt 0 ]]; then
              {
                echo "### ✅ PolicyException YAMLs — ${COUNT} file(s)"
                echo ""
                echo "Download: **policyexceptions-${{ github.run_id }}** (Artifacts section below)"
                echo ""
                echo "All exceptions carry \`namespace: kyverno\`."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### ⚠️ No files generated — expand the **Process each selected resource** step for details." >> "$GITHUB_STEP_SUMMARY"
            fi

          elif [[ "${ACTION}" == "remediate" ]]; then
            COUNT=$(find "${REMEDIATION_DIR}" -type f 2>/dev/null | wc -l | xargs)
            if [[ "${COUNT}" -gt 0 ]]; then
              {
                echo "### ✅ Remediated YAMLs — ${COUNT} file(s)"
                echo ""
                echo "Download: **remediated-yamls-${{ github.run_id }}** (Artifacts section below)"
                echo ""
                echo "Review the fixes and apply them back to your Helm chart templates."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### ⚠️ No files generated — expand the **Process each selected resource** step for details." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
