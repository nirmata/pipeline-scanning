# Deploys the Nirmata remediator agent on a local kind cluster.
# The agent scans Helm chart resources against VCS policies and creates PRs with fixes.
#
# Triggered manually from the Helm Policy Scan job summary, or via workflow_dispatch.
#
# Required secrets:
#   NIRMATA_SERVICE_ACCOUNT_TOKEN — Nirmata service account token
#   PAT                           — GitHub Personal Access Token (for CreatePR action)
#   GHCR_TOKEN                    — GitHub PAT with read:packages scope (to pull the agent image)
#
# Individual policies are checkboxes — check one or more to remediate only those violations.
# Leave all unchecked to remediate all violations at once.
# To add a new policy: add the policy file to the kyverno-policies branch and add a boolean
# input below — no values files to create or maintain.

name: Install Remediator Agent

on:
  # Manually trigger with any combination of policies checked
  workflow_dispatch:
    inputs:
      restrict_seccomp_strict:
        description: "restrict-seccomp-strict"
        type: boolean
        default: false
      require_requests_limits:
        description: "require-requests-limits"
        type: boolean
        default: false
      disallow_capabilities_strict:
        description: "disallow-capabilities-strict"
        type: boolean
        default: false
      disallow_privilege_escalation:
        description: "disallow-privilege-escalation"
        type: boolean
        default: false
      require_run_as_non_root_user:
        description: "require-run-as-non-root-user"
        type: boolean
        default: false
      require_run_as_nonroot:
        description: "require-run-as-nonroot"
        type: boolean
        default: false
      restrict_volume_types:
        description: "restrict-volume-types"
        type: boolean
        default: false
  # Called by per-policy fix-<policy>.yml trigger workflows
  workflow_call:
    inputs:
      restrict_seccomp_strict:
        type: boolean
        default: false
      require_requests_limits:
        type: boolean
        default: false
      disallow_capabilities_strict:
        type: boolean
        default: false
      disallow_privilege_escalation:
        type: boolean
        default: false
      require_run_as_non_root_user:
        type: boolean
        default: false
      require_run_as_nonroot:
        type: boolean
        default: false
      restrict_volume_types:
        type: boolean
        default: false
    secrets:
      NIRMATA_SERVICE_ACCOUNT_TOKEN:
        required: true
      PAT:
        required: true
      GHCR_TOKEN:
        required: true

permissions:
  contents: read

env:
  NGINX_REPO: https://github.com/nirmata/pipeline-scanning
  CHART_REF: helm-app
  POLICIES_BRANCH: kyverno-policies

jobs:
  install-remediator:
    name: Deploy remediator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout helm-app branch
        uses: actions/checkout@v4
        with:
          ref: helm-app

      - name: Generate VCS values patch from selected policies
        id: patch
        run: |
          set -euo pipefail
          REPO="${NGINX_REPO}"

          # --- collect checked policies ---
          SELECTED=()
          [[ "${{ inputs.restrict_seccomp_strict }}"       == "true" ]] && SELECTED+=("restrict-seccomp-strict")      || true
          [[ "${{ inputs.require_requests_limits }}"       == "true" ]] && SELECTED+=("require-requests-limits")      || true
          [[ "${{ inputs.disallow_capabilities_strict }}"  == "true" ]] && SELECTED+=("disallow-capabilities-strict") || true
          [[ "${{ inputs.disallow_privilege_escalation }}" == "true" ]] && SELECTED+=("disallow-privilege-escalation")|| true
          [[ "${{ inputs.require_run_as_non_root_user }}"  == "true" ]] && SELECTED+=("require-run-as-non-root-user") || true
          [[ "${{ inputs.require_run_as_nonroot }}"        == "true" ]] && SELECTED+=("require-run-as-nonroot")       || true
          [[ "${{ inputs.restrict_volume_types }}"         == "true" ]] && SELECTED+=("restrict-volume-types")        || true

          if [[ ${#SELECTED[@]} -eq 0 ]]; then
            echo "No policies selected — remediating all violations (using base values)."
            echo "patch_file="         >> "$GITHUB_OUTPUT"
            echo "selected_label=all violations" >> "$GITHUB_OUTPUT"
            echo "expected_prs=1"      >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Selected policies: ${SELECTED[*]}"
          echo "selected_label=${SELECTED[*]}" >> "$GITHUB_OUTPUT"

          # --- per-policy metadata (path and resource name) ---
          get_path() {
            case "$1" in
              restrict-seccomp-strict)       echo "policies/seccomp/restrict-seccomp-strict.yaml" ;;
              require-requests-limits)       echo "policies/resource-limits/require_pod_requests_limits.yaml" ;;
              disallow-capabilities-strict)  echo "policies/restricted/disallow-capabilities-strict.yaml" ;;
              disallow-privilege-escalation) echo "policies/restricted/disallow-privilege-escalation.yaml" ;;
              require-run-as-non-root-user)  echo "policies/restricted/require-run-as-non-root-user.yaml" ;;
              require-run-as-nonroot)        echo "policies/restricted/require-run-as-nonroot.yaml" ;;
              restrict-volume-types)         echo "policies/restricted/restrict-volume-types.yaml" ;;
            esac
          }

          get_resource() {
            case "$1" in
              restrict-seccomp-strict)  echo "nginx-seccomp-fix" ;;
              require-requests-limits)  echo "nginx-resource-limits-fix" ;;
              *)                        echo "nginx-restricted-fix" ;;
            esac
          }

          # --- group selected policies by resource ---
          declare -A res_policies
          for name in "${SELECTED[@]}"; do
            res=$(get_resource "$name")
            res_policies[$res]+="${name} "
          done

          # --- build patch YAML line by line (no heredoc) ---
          {
            echo "remediator:"
            echo "  target:"
            echo "    vcs:"
            echo "      policies:"
            for name in "${SELECTED[@]}"; do
              path=$(get_path "$name")
              echo "        - name: ${name}"
              echo "          repo: ${REPO}"
              echo "          path: ${path}"
              echo "          ref: kyverno-policies"
            done
            echo "      resources:"
            for res in "${!res_policies[@]}"; do
              echo "        - name: ${res}"
              echo "          repo: ${REPO}"
              echo "          path: ./"
              echo "          ref: ${CHART_REF}"
              echo "          policyRefs:"
              for pol in ${res_policies[$res]}; do
                echo "            - ${pol}"
              done
            done
            echo "tool:"
            echo "  defaults:"
            echo "    git:"
            echo "      pullRequests:"
            echo "        branchPrefix: remediation-"
          } > /tmp/vcs-patch.yaml

          echo "Generated patch:"
          cat /tmp/vcs-patch.yaml
          echo "patch_file=/tmp/vcs-patch.yaml"           >> "$GITHUB_OUTPUT"
          echo "expected_prs=${#res_policies[@]}"         >> "$GITHUB_OUTPUT"

      - name: Install kind
        run: |
          set -euo pipefail
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Create kind cluster
        run: |
          kind create cluster --name remediator-demo --wait 120s
          kubectl cluster-info

      - name: Wait for all kube-system pods to be ready
        run: |
          echo "Waiting for kube-system pods..."
          kubectl wait --for=condition=ready pod --all -n kube-system --timeout=180s
          echo "All kube-system pods ready."
          kubectl get pods -A

      - name: Create nirmata namespace
        run: kubectl create namespace nirmata

      - name: Create Nirmata service account token secret
        run: |
          kubectl create secret generic nirmata-service-account-token \
            --from-literal=service-account-token="${{ secrets.NIRMATA_SERVICE_ACCOUNT_TOKEN }}" \
            -n nirmata

      - name: Create GitHub PAT secret
        run: |
          kubectl create secret generic github-pat-token \
            --from-literal=token="${{ secrets.PAT }}" \
            -n nirmata

      - name: Create GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GHCR_TOKEN }}" \
            --docker-email=ci@example.com \
            -n nirmata

      - name: Create repo-namespace-mapping ConfigMap
        run: |
          kubectl create configmap repo-namespace-mapping \
            --from-literal=mapping='[]' \
            -n nirmata

      - name: Add nirmata Helm repo
        run: |
          helm repo add nirmata https://nirmata.github.io/kyverno-charts
          helm repo update nirmata

      - name: Install remediator agent
        run: |
          set -euo pipefail

          EXTRA_VALUES=""
          if [[ -n "${{ steps.patch.outputs.patch_file }}" ]]; then
            EXTRA_VALUES="--values ${{ steps.patch.outputs.patch_file }}"
          fi

          helm upgrade --install nirmata-agent nirmata/nirmata-agent \
            --namespace nirmata \
            --values remediator-helm-values.yaml \
            ${EXTRA_VALUES} \
            --devel \
            --wait \
            --timeout 10m
          echo "Remediator agent installed successfully."

      - name: Show pod status on failure
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -n nirmata -o wide
          echo ""
          echo "=== Pod events ==="
          kubectl describe pods -n nirmata | grep -A 20 "Events:"

      - name: Verify deployment
        run: |
          echo "=== Pods in nirmata namespace ==="
          kubectl get pods -n nirmata -o wide
          echo ""
          echo "=== Remediator CR ==="
          kubectl get remediator -n nirmata 2>/dev/null || echo "(Remediator CR not yet created)"
          echo ""
          echo "=== LLMConfig CR ==="
          kubectl get llmconfig -n nirmata 2>/dev/null || echo "(LLMConfig CR not yet created)"

      - name: Bounce agent to trigger immediate remediation cycle
        run: |
          echo "Scaling down nirmata-agent..."
          kubectl scale deployment nirmata-agent -n nirmata --replicas=0
          kubectl wait --for=delete pod -l app.kubernetes.io/instance=nirmata-agent -n nirmata --timeout=60s

          echo "Deleting all RemediationRecord CRs..."
          kubectl delete remediationrecord --all -n nirmata 2>/dev/null || echo "(no RemediationRecords found)"

          echo "Scaling back up..."
          kubectl scale deployment nirmata-agent -n nirmata --replicas=1
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=nirmata-agent -n nirmata --timeout=120s
          echo "Agent is back up."

      - name: Tail agent logs — wait for PR then open nirmatabot window
        run: |
          EXPECTED_PRS=${{ steps.patch.outputs.expected_prs || 1 }}
          echo "Phase 1: waiting for ${EXPECTED_PRS} PR(s) to be created (max 8 min)..."

          POD=$(kubectl get pod -n nirmata -l app.kubernetes.io/instance=nirmata-agent \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Tailing logs from pod: ${POD}"
          echo "---"

          TMPCOUNT=$(mktemp)
          echo 0 > "${TMPCOUNT}"

          timeout 480 kubectl logs -n nirmata "${POD}" --follow | \
            while IFS= read -r line; do
              echo "$line"
              if [[ "$line" == *"Pull request created"* ]]; then
                COUNT=$(cat "${TMPCOUNT}")
                COUNT=$((COUNT + 1))
                echo "${COUNT}" > "${TMPCOUNT}"
                echo "--- PR ${COUNT}/${EXPECTED_PRS} created."
                if [[ "${COUNT}" -ge "${EXPECTED_PRS}" ]]; then
                  echo "All ${EXPECTED_PRS} PR(s) created. Entering nirmatabot window."
                  exit 0
                fi
              fi
            done || true

          echo "---"
          PR_COUNT=$(cat "${TMPCOUNT}")
          echo "Phase 1 complete (${PR_COUNT}/${EXPECTED_PRS} PR(s) created)."

          if [[ "${PR_COUNT}" -ge "${EXPECTED_PRS}" ]]; then
            echo ""
            echo ">>> Phase 2: nirmatabot window open (20 min)."
            echo ">>> Comment on the PR to trigger actions:"
            echo ">>>   @nirmatabot split-pr <policy-name1> <policy-name2>"
            echo ">>>   @nirmatabot request-exception <policy-name> [duration] [reason]"
            echo ">>> Examples:"
            echo ">>>   @nirmatabot split-pr disallow-privilege-escalation require-run-as-nonroot"
            echo ">>>   @nirmatabot request-exception disallow-capabilities-strict 30d Approved by security team"
            echo "---"
            timeout 1200 kubectl logs -n nirmata "${POD}" --follow --since=10s 2>/dev/null || true
            echo "---"
            echo ">>> Nirmatabot window closed."
          fi

      - name: Inspect remediation state
        if: always()
        run: |
          echo "=== RemediationRecords ==="
          kubectl get remediationrecord -n nirmata 2>/dev/null || echo "(none)"
          echo ""
          echo "=== RemediationRecord details ==="
          kubectl describe remediationrecord -n nirmata 2>/dev/null || echo "(none)"
          echo ""
          echo "=== Remediator CR status ==="
          kubectl get remediator nirmata-agent -n nirmata -o yaml 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== Namespace events ==="
          kubectl get events -n nirmata --sort-by='.lastTimestamp' 2>/dev/null | tail -30

      - name: Write job summary
        if: always()
        run: |
          STATUS="unknown"
          if kubectl get deployment nirmata-agent -n nirmata &>/dev/null 2>&1; then
            READY=$(kubectl get deployment nirmata-agent -n nirmata \
              -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            [[ "${READY}" -ge 1 ]] && STATUS="success" || STATUS="pending"
          else
            STATUS="failed"
          fi

          {
            echo "## Remediator Agent Installation"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Cluster      | \`remediator-demo\` (kind) |"
            echo "| Namespace    | \`nirmata\` |"
            echo "| Policies | \`${{ steps.patch.outputs.selected_label }}\` |"
            echo "| Chart        | \`nirmata/nirmata-agent\` (--devel) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${STATUS}" == "success" ]]; then
            {
              echo "### ✅ Remediator agent is running"
              echo ""
              echo "**Next step:** Check the [Pull Requests](https://github.com/${{ github.repository }}/pulls) tab for the remediation PR."
              echo ""
              echo "The PR description contains **nirmatabot commands** you can use by commenting on the PR:"
              echo ""
              echo "| Command | What it does |"
              echo "|---|---|"
              echo "| \`@nirmatabot split-pr <policy1> <policy2>\` | Splits a multi-policy PR into separate per-policy PRs |"
              echo "| \`@nirmatabot request-exception <policy> [duration] [reason]\` | Requests a PolicyException in NCH for that policy |"
              echo ""
              echo "> **Note:** The nirmatabot window is open for **20 minutes** from PR creation."
              echo "> Post your comment on the PR within that window."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ Deployment did not complete successfully"
              echo ""
              echo "Check the **Install remediator agent** step logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
