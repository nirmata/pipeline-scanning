# Deploys the Nirmata remediator agent on a local kind cluster.
# The agent scans Helm chart resources against VCS policies and creates PRs with fixes.
#
# Triggered manually from the Helm Policy Scan job summary, or via workflow_dispatch.
#
# Required secrets:
#   NIRMATA_SERVICE_ACCOUNT_TOKEN — Nirmata service account token
#   PAT                           — GitHub Personal Access Token (for CreatePR action)

name: Install Remediator Agent

on:
  workflow_dispatch:
    inputs:
      policy_group:
        description: "Policy group to remediate"
        required: true
        default: "All violations"
        type: choice
        options:
          - All violations
          - Seccomp violations
          - Resource limit violations

permissions:
  contents: read

jobs:
  install-remediator:
    name: Deploy remediator — ${{ inputs.policy_group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout remediation-helm-chart branch
        uses: actions/checkout@v4
        with:
          ref: remediation-helm-chart

      - name: Install kind
        run: |
          set -euo pipefail
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Create kind cluster
        run: |
          kind create cluster --name remediator-demo --wait 120s
          kubectl cluster-info

      - name: Wait for all kube-system pods to be ready
        run: |
          echo "Waiting for kube-system pods..."
          kubectl wait --for=condition=ready pod --all -n kube-system --timeout=180s
          echo "All kube-system pods ready."
          kubectl get pods -A

      - name: Create nirmata namespace
        run: kubectl create namespace nirmata

      - name: Create Nirmata service account token secret
        run: |
          kubectl create secret generic nirmata-service-account-token \
            --from-literal=service-account-token="${{ secrets.NIRMATA_SERVICE_ACCOUNT_TOKEN }}" \
            -n nirmata

      - name: Create GitHub PAT secret
        run: |
          kubectl create secret generic github-pat-token \
            --from-literal=token="${{ secrets.PAT }}" \
            -n nirmata

      - name: Create repo-namespace-mapping ConfigMap
        run: |
          kubectl create configmap repo-namespace-mapping \
            --from-literal=mapping='[]' \
            -n nirmata

      - name: Select values file based on policy group
        id: values
        run: |
          case "${{ inputs.policy_group }}" in
            "Seccomp violations")
              echo "file=remediator-helm-values-seccomp.yaml" >> "$GITHUB_OUTPUT"
              echo "label=seccomp" >> "$GITHUB_OUTPUT"
              ;;
            "Resource limit violations")
              echo "file=remediator-helm-values-resource-limits.yaml" >> "$GITHUB_OUTPUT"
              echo "label=resource-limits" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "file=remediator-helm-values.yaml" >> "$GITHUB_OUTPUT"
              echo "label=all" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "Using values file: $(cat $GITHUB_OUTPUT | grep file | cut -d= -f2)"

      - name: Clone kyverno-charts (remediator Helm chart)
        run: |
          git clone --depth=1 https://github.com/nirmata/kyverno-charts.git /tmp/kyverno-charts

      - name: Install remediator agent
        run: |
          set -euo pipefail
          helm upgrade --install remediator-agent /tmp/kyverno-charts/charts/go-agent-remediator \
            --namespace nirmata \
            --values ${{ steps.values.outputs.file }} \
            --set image.repository=ghcr.io/nirmata/go-agent-remediator \
            --wait \
            --timeout 10m
          echo "Remediator agent installed successfully."

      - name: Show pod status on failure
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -n nirmata -o wide
          echo ""
          echo "=== Pod events ==="
          kubectl describe pods -n nirmata | grep -A 20 "Events:"

      - name: Verify deployment
        run: |
          echo "=== Pods in nirmata namespace ==="
          kubectl get pods -n nirmata -o wide
          echo ""
          echo "=== Remediator CR ==="
          kubectl get remediator -n nirmata 2>/dev/null || echo "(Remediator CR not yet created)"
          echo ""
          echo "=== LLMConfig CR ==="
          kubectl get llmconfig -n nirmata 2>/dev/null || echo "(LLMConfig CR not yet created)"

      - name: Bounce agent to trigger immediate remediation cycle
        run: |
          echo "Scaling down remediator agent..."
          kubectl scale deployment remediator-agent -n nirmata --replicas=0
          kubectl wait --for=delete pod -l app.kubernetes.io/instance=remediator-agent -n nirmata --timeout=60s

          echo "Deleting all RemediationRecord CRs..."
          kubectl delete remediationrecord --all -n nirmata 2>/dev/null || echo "(no RemediationRecords found)"

          echo "Scaling back up..."
          kubectl scale deployment remediator-agent -n nirmata --replicas=1
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=remediator-agent -n nirmata --timeout=120s
          echo "Agent is back up."

      - name: Tail agent logs until PR created (max 8 minutes)
        run: |
          POD=$(kubectl get pod -n nirmata -l app.kubernetes.io/instance=remediator-agent \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Tailing logs from pod: ${POD}"
          echo "---"
          timeout 480 kubectl logs -n nirmata "${POD}" --follow | \
            while IFS= read -r line; do
              echo "$line"
              if [[ "$line" == *"Pull request created"* ]]; then
                echo "---"
                echo "Pull request created successfully. Stopping log tail."
                exit 0
              fi
            done || true
          echo "---"
          echo "Log tail ended."

      - name: Inspect remediation state
        if: always()
        run: |
          echo "=== RemediationRecords ==="
          kubectl get remediationrecord -n nirmata 2>/dev/null || echo "(none)"
          echo ""
          echo "=== RemediationRecord details ==="
          kubectl describe remediationrecord -n nirmata 2>/dev/null || echo "(none)"
          echo ""
          echo "=== Remediator CR status ==="
          kubectl get remediator nirmata-agent -n nirmata -o yaml 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== Namespace events ==="
          kubectl get events -n nirmata --sort-by='.lastTimestamp' 2>/dev/null | tail -30

      - name: Write job summary
        if: always()
        run: |
          STATUS="unknown"
          if kubectl get deployment -n nirmata -l app.kubernetes.io/instance=remediator-agent &>/dev/null 2>&1; then
            READY=$(kubectl get deployment -n nirmata -l app.kubernetes.io/instance=remediator-agent \
              -o jsonpath='{.items[0].status.readyReplicas}' 2>/dev/null || echo "0")
            [[ "${READY}" -ge 1 ]] && STATUS="success" || STATUS="pending"
          else
            STATUS="failed"
          fi

          {
            echo "## Remediator Agent Installation"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Cluster   | \`remediator-demo\` (kind) |"
            echo "| Namespace | \`nirmata\` |"
            echo "| Chart     | \`go-agent-remediator\` from nirmata/kyverno-charts |"
            echo "| Values    | \`remediator-helm-values.yaml\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${STATUS}" == "success" ]]; then
            {
              echo "### ✅ Remediator agent is running"
              echo ""
              echo "The agent will:"
              echo "1. Clone the policy and resource repositories defined in \`remediator-helm-values.yaml\`"
              echo "2. Scan the Helm chart resources against the configured policies"
              echo "3. Generate fixes and open a pull request in the target repository"
              echo ""
              echo "**Next step:** Check the [Pull Requests](https://github.com/${{ github.repository }}/pulls) tab for the remediation PR created by the agent."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ Deployment did not complete successfully"
              echo ""
              echo "Check the **Install remediator agent** and **Verify deployment** step logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
