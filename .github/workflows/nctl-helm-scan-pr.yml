# Triggered on every push to exceptions-in-pipelines.
# Scans the Helm chart, records violating pod controllers, and renders per-resource YAMLs.
#
# After a scan run completes:
#   1. Review the violations table in the job summary.
#   2. Go to Actions → "nctl Helm policy scan" → Run workflow.
#   3. Paste resource names, pick an action, and run — artifacts contain the results.
#
# Required secrets : NIRMATA_URL, NIRMATA_TOKEN
# Optional secret  : NIRMATA_USERID
# Optional variable: HELM_CHART_PATH (defaults to ".")

name: nctl Helm policy scan

on:
  push:
    branches: [exceptions-in-pipelines]
  workflow_dispatch:
    inputs:
      selected_resources:
        description: |
          Comma-separated pod controllers to process — copy names from the scan summary.
          Format: Kind/name   e.g.  Deployment/nginx,StatefulSet/redis
          Leave empty to run the scan only.
        required: false
        default: ''
      action:
        description: |
          Action to perform on every selected resource:
            generate-exception → Kyverno PolicyException YAML  (namespace: kyverno)
            remediate          → fixed K8s resource YAML with all violations resolved
        required: false
        default: 'generate-exception'
        type: choice
        options:
          - generate-exception
          - remediate

concurrency:
  group: nctl-helm-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NIRMATA_URL: ${{ secrets.NIRMATA_URL }}
  NIRMATA_TOKEN: ${{ secrets.NIRMATA_TOKEN }}
  POLICY_SETS: pss-baseline,pss-restricted
  CHART_PATH: ${{ vars.HELM_CHART_PATH != '' && vars.HELM_CHART_PATH || '.' }}
  POLICYEXCEPTION_DIR: policyexceptions
  REMEDIATION_DIR: remediated

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 1 — Scan + render (always runs)
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  scan:
    name: Scan Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      violations_found: ${{ steps.parse.outputs.violations_found }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Install nctl
        run: |
          set -euo pipefail
          curl -fsSL https://downloads.nirmata.io/nctl/install.sh | bash
          echo "$(dirname "$(command -v nctl)")" >> "${GITHUB_PATH}"
          nctl version

      - name: Authenticate nctl
        env:
          NIRMATA_USERID: ${{ secrets.NIRMATA_USERID }}
        run: |
          [ -n "${NIRMATA_USERID:-}" ] &&
            nctl login --url "${NIRMATA_URL}" --userid "${NIRMATA_USERID}" --token "${NIRMATA_TOKEN}" ||
            true

      - name: Validate chart path
        run: |
          set -euo pipefail
          [[ -d "${CHART_PATH}" ]] || { echo "::error::HELM_CHART_PATH '${CHART_PATH}' is not a directory"; exit 1; }
          # Large zip at repo root exceeds nctl's 5 MB package limit
          [[ "${CHART_PATH}" == "." && -f nctl.zip ]] && rm -f nctl.zip || true

      - name: Scan Helm chart
        id: scan
        continue-on-error: true
        run: |
          set -euo pipefail
          nctl scan helm -r "${CHART_PATH}" --policy-sets "${POLICY_SETS}" -o json | tee report.json

      - name: Parse violations — extract pod controllers
        id: parse
        if: always() && hashFiles('report.json') != ''
        run: |
          set -euo pipefail
          # nctl report format: policies[].namespaceScopedResources[].resources[]
          # Resource name embeds kind as suffix: "release-name-my-nginx-chart (Deployment)"
          # Uses split(" (") to extract kind — avoids jq named-capture regex failures
          jq -r '
            .policies // [] |
            map(
              .namespaceScopedResources // [] |
              map(.resources // [] | .[]) | flatten |
              map(select(
                .rules // [] | map(select(.Status == "fail")) | length > 0
              )) |
              map(
                (.name | split(" (")) as $parts |
                if ($parts | length) > 1 then
                  ($parts[-1] | rtrimstr(")")) as $kind |
                  ($parts[0:-1] | join(" (")) as $rname |
                  select(
                    $kind == "Deployment"  or $kind == "StatefulSet" or
                    $kind == "DaemonSet"   or $kind == "ReplicaSet"  or
                    $kind == "Job"         or $kind == "CronJob"
                  ) |
                  "\($kind)/\($rname)"
                else empty end
              )
            ) |
            flatten | unique | .[]
          ' report.json > violating_controllers.txt 2>/dev/null || true

          [[ -s violating_controllers.txt ]] &&
            echo "violations_found=true" >> "$GITHUB_OUTPUT" ||
            echo "violations_found=false" >> "$GITHUB_OUTPUT"

      - name: Render Helm chart — split into per-resource YAML files
        if: always() && hashFiles('report.json') != ''
        run: |
          set -euo pipefail
          mkdir -p rendered-resources

          helm dependency build "${CHART_PATH}" 2>/dev/null || true
          helm template scan-release "${CHART_PATH}" > all-rendered.yaml 2>/dev/null || true

          if [[ -s all-rendered.yaml ]]; then
            python3 << 'PYEOF'
          import yaml, os, re
          os.makedirs("rendered-resources", exist_ok=True)
          with open("all-rendered.yaml") as f:
              docs = list(yaml.safe_load_all(f))
          for doc in docs:
              if not isinstance(doc, dict):
                  continue
              kind = doc.get("kind", "unknown")
              name = doc.get("metadata", {}).get("name", "unknown")
              safe = re.sub(r"[^a-zA-Z0-9_-]", "-", name)
              out  = f"rendered-resources/{kind.lower()}-{safe}.yaml"
              with open(out, "w") as f:
                  yaml.dump(doc, f, default_flow_style=False, allow_unicode=True)
          PYEOF
            echo "Rendered resource files:"
            ls rendered-resources/
          else
            echo "::warning::helm template produced no output — nctl ai will work from chart files directly"
          fi

      - name: Upload scan artifacts
        if: always() && hashFiles('report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: scan-artifacts-${{ github.run_id }}
          path: |
            report.json
            rendered-resources/
          retention-days: 7
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## nctl Helm Policy Scan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Policy sets | \`${POLICY_SETS}\` |"
            echo "| Chart path | \`${CHART_PATH}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ steps.parse.outputs.violations_found }}" == "true" ]]; then
            {
              echo "### ⚠️ Violating Pod Controllers"
              echo ""
              echo "| # | Resource |"
              echo "|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"
            i=1
            while IFS= read -r r; do
              echo "| ${i} | \`${r}\` |" >> "$GITHUB_STEP_SUMMARY"
              i=$((i+1))
            done < violating_controllers.txt

            # Build comma-separated list of all violating resources for pre-filled CLI commands
            ALL_RESOURCES=$(paste -sd',' violating_controllers.txt)

            {
              echo ""
              echo "---"
              echo "### ▶️ Next step — process resources via GitHub UI"
              echo ""
              echo "1. [**→ Open: nctl Helm — process resources**](https://github.com/${{ github.repository }}/actions/workflows/nctl-helm-process.yml)"
              echo "2. Click the **Run workflow** button on the right side of the page"
              echo "3. Fill in the two fields that appear:"
              echo ""
              echo "   | Field | What to enter |"
              echo "   |---|---|"
              echo "   | **selected_resources** | paste name(s) from the table above, comma-separated |"
              echo "   | **action** | \`generate-exception\` or \`remediate\` |"
              echo ""
              echo "   - \`generate-exception\` → Kyverno PolicyException YAML (\`namespace: kyverno\`)"
              echo "   - \`remediate\`           → fixed K8s resource YAML with all violations resolved"
              echo ""
              echo "4. Click **Run workflow** — download the output ZIP from the run's **Artifacts** section"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ No pod controller violations found" >> "$GITHUB_STEP_SUMMARY"
          fi

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 2 — Process user-selected resources  (workflow_dispatch only)
# ═══════════════════════════════════════════════════════════════════════════════
  process:
    name: "${{ inputs.action }} — ${{ inputs.selected_resources }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: scan
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.selected_resources != ''

    steps:
      - uses: actions/checkout@v4

      - name: Install nctl (with ai)
        run: |
          set -euo pipefail
          curl -fsSL https://downloads.nirmata.io/nctl/install.sh | bash
          echo "$(dirname "$(command -v nctl)")" >> "${GITHUB_PATH}"
          nctl version
          nctl ai --help >/dev/null

      - name: Authenticate nctl
        env:
          NIRMATA_USERID: ${{ secrets.NIRMATA_USERID }}
        run: |
          [ -n "${NIRMATA_USERID:-}" ] &&
            nctl login --url "${NIRMATA_URL}" --userid "${NIRMATA_USERID}" --token "${NIRMATA_TOKEN}" ||
            true

      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        with:
          name: scan-artifacts-${{ github.run_id }}
          path: scan-artifacts

      - name: Prepare workspace
        run: |
          cp scan-artifacts/report.json report.json
          cp -r scan-artifacts/rendered-resources rendered-resources 2>/dev/null || mkdir -p rendered-resources

      - name: Process each selected resource
        env:
          SELECTED: ${{ inputs.selected_resources }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          mkdir -p "${POLICYEXCEPTION_DIR}" "${REMEDIATION_DIR}"

          IFS=',' read -ra RESOURCES <<< "${SELECTED}"

          for resource in "${RESOURCES[@]}"; do
            resource="$(echo "${resource}" | xargs)"
            KIND="${resource%%/*}"
            NAME="${resource##*/}"

            echo "::group::▶ ${ACTION}  →  ${KIND}/${NAME}"

            # ── Extract violations for this resource ──────────────────────
            # Name in report is "release-name-my-nginx-chart (Deployment)" → match with KIND+NAME
            VIOLATIONS="$(jq -r --arg k "${KIND}" --arg n "${NAME}" '
              .policies // [] |
              map(. as $pol |
                (.namespaceScopedResources // []) |
                map(.resources // [] | .[]) | flatten |
                map(select(.name == ($n + " (" + $k + ")"))) |
                map(
                  .rules // [] |
                  map(select(.Status == "fail")) |
                  map("  policy: \($pol.name)\n  rule:   \(.Name)\n  reason: \(.Message)\n")
                ) | flatten
              ) |
              flatten | .[]
            ' report.json 2>/dev/null)"

            if [[ -z "${VIOLATIONS}" ]]; then
              echo "::warning::No violations found in report.json for ${KIND}/${NAME} — skipping"
              echo "::endgroup::"
              continue
            fi

            echo "Violations:"
            echo "${VIOLATIONS}"

            # ── Locate rendered resource YAML ─────────────────────────────
            RESOURCE_YAML_FILE="rendered-resources/${KIND,,}-${NAME}.yaml"
            if [[ ! -f "${RESOURCE_YAML_FILE}" ]]; then
              # Helm may have prefixed the name with the release name
              RESOURCE_YAML_FILE="$(find rendered-resources/ -iname "*${NAME}*.yaml" 2>/dev/null | head -1 || true)"
            fi

            if [[ -n "${RESOURCE_YAML_FILE}" && -f "${RESOURCE_YAML_FILE}" ]]; then
              RESOURCE_YAML="$(cat "${RESOURCE_YAML_FILE}")"
            else
              echo "::warning::Rendered YAML not found for ${KIND}/${NAME} — nctl ai will locate it in the chart"
              RESOURCE_YAML="(not available — locate the ${KIND} named ${NAME} inside ${CHART_PATH})"
            fi

            # ── Build nctl ai prompt ──────────────────────────────────────
            PROMPT_FILE="$(mktemp)"

            if [[ "${ACTION}" == "generate-exception" ]]; then

              OUT_FILE="${POLICYEXCEPTION_DIR}/${KIND,,}-${NAME}-exception.yaml"
              cat > "${PROMPT_FILE}" << EOF
          Task: Generate a Kyverno PolicyException YAML for the resource below.

          ## Resource
          Kind : ${KIND}
          Name : ${NAME}

          ## Rendered Kubernetes YAML
          \`\`\`yaml
          ${RESOURCE_YAML}
          \`\`\`

          ## Policy violations to exempt
          ${VIOLATIONS}

          ## Output spec — copy this structure exactly, fill in the values
          \`\`\`yaml
          apiVersion: kyverno.io/v2beta1
          kind: PolicyException
          metadata:
            name: ${KIND,,}-${NAME}-exception
            namespace: kyverno          # REQUIRED — do not change; Kyverno only processes exceptions from the kyverno namespace
          spec:
            match:
              any:
              - resources:
                  kinds:
                  - ${KIND}
                  names:
                  - "${NAME}"
            exceptions:
            - policyName: <policy-name>   # repeat one block per unique policy above
              ruleNames:
              - <rule-name>               # list every failing rule for that policy
          \`\`\`

          Rules:
          - Output a single complete YAML document — no prose, no markdown fences, no extra keys.
          - Every policy/rule pair from the violations list MUST appear in spec.exceptions.
          - metadata.namespace MUST be "kyverno" — never override this.

          Write the file to: ${OUT_FILE}
          EOF

            elif [[ "${ACTION}" == "remediate" ]]; then

              OUT_FILE="${REMEDIATION_DIR}/${KIND,,}-${NAME}.yaml"
              cat > "${PROMPT_FILE}" << EOF
          Task: Fix all Kyverno policy violations in the Kubernetes resource below and output the corrected YAML.

          ## Resource
          Kind : ${KIND}
          Name : ${NAME}

          ## Current Kubernetes YAML
          \`\`\`yaml
          ${RESOURCE_YAML}
          \`\`\`

          ## Violations to fix
          ${VIOLATIONS}

          ## Instructions
          1. For each violation, identify the exact field that is non-compliant.
          2. Change ONLY those fields — do not alter any other configuration.
          3. Common fixes by rule:
             - disallow-privilege-escalation   → set securityContext.allowPrivilegeEscalation: false on every container
             - require-run-as-nonroot          → set securityContext.runAsNonRoot: true on pod and/or containers
             - disallow-privileged-containers  → set securityContext.privileged: false on every container
             - drop-all-capabilities           → set securityContext.capabilities.drop: [ALL] on every container
             - disallow-host-namespaces        → remove / set false: hostPID, hostIPC, hostNetwork
             - restrict-volume-types           → remove disallowed volume types from spec.volumes
          4. Output a single complete valid Kubernetes YAML document — no explanation, no markdown fences.

          Write the fixed YAML to: ${OUT_FILE}
          EOF
            fi

            nctl ai --new-session \
              --allowed-dirs "$(pwd)" \
              --prompt "$(cat "${PROMPT_FILE}")" \
              --skip-permission-checks \
              --force \
              || echo "::warning::nctl ai did not complete successfully for ${KIND}/${NAME}"

            rm -f "${PROMPT_FILE}"
            echo "::endgroup::"
          done

      # Guarantee namespace: kyverno in every generated PolicyException regardless of nctl ai output
      - name: Enforce namespace kyverno in PolicyException YAMLs
        if: inputs.action == 'generate-exception'
        run: |
          find "${POLICYEXCEPTION_DIR}" \( -name "*.yaml" -o -name "*.yml" \) | while IFS= read -r f; do
            python3 - "${f}" << 'PYEOF'
          import sys, yaml
          path = sys.argv[1]
          with open(path) as fh:
              docs = list(yaml.safe_load_all(fh))
          changed = False
          for doc in docs:
              if isinstance(doc, dict) and doc.get("kind") == "PolicyException":
                  doc.setdefault("metadata", {})
                  if doc["metadata"].get("namespace") != "kyverno":
                      doc["metadata"]["namespace"] = "kyverno"
                      changed = True
          if changed:
              with open(path, "w") as fh:
                  yaml.dump_all(docs, fh, default_flow_style=False, allow_unicode=True)
              print(f"Enforced namespace: kyverno → {path}")
          PYEOF
          done

      - name: Upload PolicyException artifacts
        if: inputs.action == 'generate-exception'
        uses: actions/upload-artifact@v4
        with:
          name: policyexceptions-${{ github.run_id }}
          path: ${{ env.POLICYEXCEPTION_DIR }}
          if-no-files-found: warn

      - name: Upload remediation artifacts
        if: inputs.action == 'remediate'
        uses: actions/upload-artifact@v4
        with:
          name: remediated-yamls-${{ github.run_id }}
          path: ${{ env.REMEDIATION_DIR }}
          if-no-files-found: warn

      - name: Write process summary
        if: always()
        env:
          SELECTED: ${{ inputs.selected_resources }}
          ACTION: ${{ inputs.action }}
        run: |
          {
            echo "## Processing Results"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Resources | \`${SELECTED}\` |"
            echo "| Action    | \`${ACTION}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${ACTION}" == "generate-exception" ]]; then
            COUNT=$(find "${POLICYEXCEPTION_DIR}" \( -name "*.yaml" -o -name "*.yml" \) 2>/dev/null | wc -l | xargs)
            if [[ "${COUNT}" -gt 0 ]]; then
              {
                echo "### ✅ PolicyException YAMLs — ${COUNT} file(s) generated"
                echo ""
                echo "Download artifact: **policyexceptions-${{ github.run_id }}**"
                echo ""
                echo "All exceptions carry \`namespace: kyverno\`."
                echo ""
                echo "\`\`\`bash"
                echo "kubectl apply -f <extracted-dir>/"
                echo "\`\`\`"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### ⚠️ No PolicyException YAMLs generated — check the **Process each selected resource** step logs." >> "$GITHUB_STEP_SUMMARY"
            fi

          elif [[ "${ACTION}" == "remediate" ]]; then
            COUNT=$(find "${REMEDIATION_DIR}" -type f 2>/dev/null | wc -l | xargs)
            if [[ "${COUNT}" -gt 0 ]]; then
              {
                echo "### ✅ Remediated YAMLs — ${COUNT} file(s) generated"
                echo ""
                echo "Download artifact: **remediated-yamls-${{ github.run_id }}**"
                echo ""
                echo "Review each file, then apply the relevant fixes to your Helm chart templates."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### ⚠️ No remediated YAMLs generated — check the **Process each selected resource** step logs." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
