# Scans the Helm chart on helm-app branch against custom policies
# from the kyverno-policies branch (policies/seccomp, policies/resource-limits).
# Publishes results to NCH, then shows per-violation action buttons:
#   ▶ Fix           — triggers the remediator agent to open a fix PR
#   🔒 Exception    — links to NCH where the user can request a policy exception
#
# Required secrets: NIRMATA_URL, NIRMATA_TEAM_TOKEN
# Optional: run manually via workflow_dispatch

name: Helm Policy Scan

on:
  push:
    branches: [helm-app]
  workflow_dispatch:

concurrency:
  group: helm-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHART_PATH: charts/my-nginx-chart
  POLICIES_REPO: https://github.com/nirmata/pipeline-scanning
  POLICIES_BRANCH: kyverno-policies
  NIRMATA_URL: ${{ vars.NIRMATA_URL }}
  NIRMATA_TOKEN: ${{ secrets.NIRMATA_USER_TOKEN }}
  REMEDIATION_WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/workflows/install-remediator.yml

jobs:
  scan:
    name: Scan Helm chart for policy violations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Install nctl
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/nctl \
            https://github.com/nirmata/pipeline-scanning/releases/download/nctl-fix-helm-exceptions/nctl-linux-amd64
          chmod +x /usr/local/bin/nctl
          echo /usr/local/bin >> "${GITHUB_PATH}"
          nctl version

      - name: Login to Nirmata as a DevOps User
        run: |
          # echo "Running with user token..."
          # nctl version
          nctl login nch \
            --userid ${{ vars.NIRMATA_USERID }} \
            --token ${{ secrets.NIRMATA_USER_TOKEN }} \
            --url ${{ vars.NIRMATA_URL }}         

      # - name: Install nctl
      #   run: |
      #     set -euo pipefail
      #     curl -fsSL https://downloads.nirmata.io/nctl/install.sh | NCTL_VERSION=4.10.17 bash
      #     echo "$(dirname "$(command -v nctl)")" >> "${GITHUB_PATH}"
      #     nctl version

      # - name: Scan Helm chart
      #   id: scan
      #   continue-on-error: true
      #   run: |
      #     set -euo pipefail
      #     git clone --no-checkout --depth=1 --filter=blob:none \
      #       --branch kyverno-policies \
      #       https://github.com/nirmata/pipeline-scanning.git pipeline-scanning
      #     cd pipeline-scanning
      #     git sparse-checkout init --cone
      #     git sparse-checkout set policies
      #     git checkout HEAD
      #     cd ..
      #     nctl scan helm -r "${CHART_PATH}" \
      #       -p "pipeline-scanning/policies/baseline" \
      #       -p "pipeline-scanning/policies/restricted" \
      #       -p "pipeline-scanning/policies/seccomp" \
      #       -p "pipeline-scanning/policies/resource-limits" \
      #       -o json \
      #       | tee report.json

      # - name: Publish scan results to NCH
      #   if: always()
      #   continue-on-error: true
      #   timeout-minutes: 5
      #   run: |
      #     TOKEN="${{ secrets.NIRMATA_TEAM_TOKEN }}"
      #     if [[ -z "${TOKEN}" ]]; then
      #       echo "NIRMATA_TEAM_TOKEN secret is not set — skipping NCH publish."
      #       exit 0
      #     fi
      #     nctl login --url "${NIRMATA_URL}" --userid "${{ vars.NIRMATA_USERID }}" --token "${{ secrets.NIRMATA_USER_TOKEN }}"
      #     nctl scan repository \
      #       --policies="pipeline-scanning/policies" \
      #       --publish-token "${TOKEN}"


      - name: Checkout kyverno policies
        run: |
          set -euo pipefail
          git clone --no-checkout --depth=1 --filter=blob:none \
            --branch kyverno-policies \
            https://github.com/nirmata/pipeline-scanning.git pipeline-scanning
          cd pipeline-scanning
          git sparse-checkout init --cone
          git sparse-checkout set policies
          git checkout HEAD

      - name: Scan repository against kyverno policies
        run: |
          set -euo pipefail
          nctl scan repository \
            --policies="pipeline-scanning/policies/baseline" \
            --policies="pipeline-scanning/policies/restricted" \
            --policies="pipeline-scanning/policies/seccomp" \
            --policies="pipeline-scanning/policies/resource-limits" \
            --url "${{ vars.NIRMATA_URL }}" \
            --token "${{ secrets.NIRMATA_TEAM_TOKEN }}" \
            --publish 2>&1 | tee /tmp/scan-output.txt
          true  # violations are handled by the parse + fail steps below

      - name: Parse violations
        id: parse
        if: always()
        run: |
          set -euo pipefail

          # Strip ANSI escape codes so text matching works reliably
          sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/scan-output.txt \
            > /tmp/scan-clean.txt 2>/dev/null || true

          # Extract resource name from "resource: <name>:" line
          RESOURCE=$(sed -n 's/.*resource: \([^: ]*\).*/\1/p' /tmp/scan-clean.txt \
            | head -1 || true)
          RESOURCE="${RESOURCE:-unknown}"

          rm -f violations.json

          # Parse each "| policy/rule | fail | ... |" row
          while IFS='|' read -r _ policy_rule result _rest; do
            policy_rule=$(echo "$policy_rule" | xargs 2>/dev/null || true)
            result=$(echo "$result" | xargs 2>/dev/null || true)
            if [[ "$result" == "fail" && "$policy_rule" == */* ]]; then
              policy="${policy_rule%%/*}"
              rule="${policy_rule#*/}"
              case "$policy" in
                require-requests-limits) sev="high" ;;
                *) sev="medium" ;;
              esac
              jq -n \
                --arg resource "$RESOURCE" \
                --arg policy   "$policy" \
                --arg rule     "$rule" \
                --arg severity "$sev" \
                '{resource:$resource,policy:$policy,rule:$rule,severity:$severity}' \
                >> violations.json
            fi
          done < /tmp/scan-clean.txt

          COUNT=0
          if [[ -f violations.json && -s violations.json ]]; then
            COUNT=$(grep -c '^{' violations.json || true)
          fi
          echo "violations_count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [[ "${COUNT}" -gt 0 ]]; then
            echo "violations_found=true"  >> "$GITHUB_OUTPUT"
          else
            echo "violations_found=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Parsed ${COUNT} violation(s)"

      - name: Write job summary
        if: always()
        run: |
          GH_REPO="https://github.com/${{ github.repository }}"

          {
            echo "## Helm Policy Scan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Chart  | \`${CHART_PATH}\` |"
            echo "| Policies | \`${POLICIES_BRANCH}:policies/{baseline,restricted,seccomp,resource-limits}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          REPO_URL="${GH_REPO}"
          ENCODED_REPO=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${REPO_URL}', safe=''))")
          if [[ "${NIRMATA_URL}" =~ ://nirmata\.io(/|$) ]]; then
            WEBCLIENT_BASE="https://www.nirmata.io"
          else
            WEBCLIENT_BASE="${NIRMATA_URL}"
          fi
          NCH_EXCEPTION_URL="${WEBCLIENT_BASE}/webclient/#policy-reports/repositories/${ENCODED_REPO}/findings"

          if [[ "${{ steps.parse.outputs.violations_found }}" == "true" ]]; then
            {
              echo "### ❌ ${{ steps.parse.outputs.violations_count }} violation(s) detected"
              echo ""
              echo "For each violation, click **🛠️ Fix** to open a one-click remediation workflow"
              echo "(pre-targeted at that policy — just press **Run workflow**),"
              echo "or click **📋 Exception** to file a policy exception in NCH."
              echo ""
              echo "| Violation | Policy | Rule | Severity | Actions |"
              echo "|---|---|---|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"

            jq -r '.resource + "\t" + .policy + "\t" + .rule + "\t" + .severity' \
              violations.json 2>/dev/null | \
              while IFS=$'\t' read -r res pol rule sev; do
                res="$(echo "$res" | xargs)"
                pol="$(echo "$pol" | xargs)"
                rule="$(echo "$rule" | xargs)"
                sev="$(echo "$sev" | xargs)"

                FIX_URL="${GH_REPO}/actions/workflows/fix-${pol}.yml"

                echo "| \`${res}\` | \`${pol}\` | \`${rule}\` | ${sev} | [🛠️ Fix](${FIX_URL}) &nbsp;**OR**&nbsp; [📋 Exception](${NCH_EXCEPTION_URL}) |" \
                  >> "$GITHUB_STEP_SUMMARY"
              done

            {
              echo ""
              echo "---"
              echo "### How to act on a violation"
              echo ""
              echo "#### Option 1 — 🛠️ Fix (one-click remediation PR)"
              echo "1. Click **🛠️ Fix** next to the violation"
              echo "2. Click **Run workflow** — the remediator agent opens a PR with the fix automatically"
              echo ""
              echo "#### Option 2 — 📋 File an Exception (via NCH)"
              echo "1. Click **📋 File an Exception** — you will land directly on the findings page for this repository"
              echo "2. Select the violation and submit an exception request"
              echo "3. Once approved, the exception will be applied and future scans will pass"
            } >> "$GITHUB_STEP_SUMMARY"

          else
            echo "### ✅ No violations found — chart is compliant" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail pipeline on violations
        if: steps.parse.outputs.violations_found == 'true'
        run: |
          echo "::error::Helm policy scan failed: ${{ steps.parse.outputs.violations_count }} violation(s) found in ${CHART_PATH}. See job summary to fix violations or request policy exceptions."
          exit 1

