# Scans the Helm chart on remediation-helm-chart branch against custom policies
# from the exceptions-in-pipelines branch (policies/seccomp, policies/resource-limits).
# Publishes results to NCH, then shows per-violation action buttons:
#   ▶ Fix           — triggers the remediator agent to open a fix PR
#   🔒 Exception    — links to NCH where the user can request a policy exception
#
# Required secrets: NIRMATA_URL, NIRMATA_TEAM_TOKEN
# Optional: run manually via workflow_dispatch

name: Helm Policy Scan

on:
  push:
    branches: [remediation-helm-chart]
  workflow_dispatch:

concurrency:
  group: helm-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHART_PATH: charts/my-nginx-chart
  POLICIES_REPO: https://github.com/nsagark/nginx
  POLICIES_BRANCH: exceptions-in-pipelines
  POLICIES_PATH: policies
  NIRMATA_URL: ${{ vars.NIRMATA_URL }}
  REMEDIATION_WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/workflows/install-remediator.yml

jobs:
  scan:
    name: Scan Helm chart for policy violations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Install nctl
        run: |
          set -euo pipefail
          curl -fsSL https://downloads.nirmata.io/nctl/install.sh | bash
          echo "$(dirname "$(command -v nctl)")" >> "${GITHUB_PATH}"
          nctl version

      - name: Scan Helm chart
        id: scan
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone https://github.com/nsagark/nginx.git
          cd nginx && git checkout exceptions-in-pipelines && cd ..
          nctl scan helm -r "${CHART_PATH}" -p "nginx/policies" -o json \
            | tee report.json

      - name: Publish scan results to NCH
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [[ -z "${NIRMATA_URL}" ]]; then
            echo "NIRMATA_URL variable is not set — skipping NCH publish."
            exit 0
          fi
          nctl scan repository \
            --policies="nginx/policies" \
            --url "${NIRMATA_URL}" \
            --token "${{ secrets.NIRMATA_TEAM_TOKEN }}" \
            --publish

      - name: Parse violations
        id: parse
        if: always() && hashFiles('report.json') != ''
        run: |
          set -euo pipefail

          jq -r '
            .policies // [] |
            map(. as $pol |
              (.namespaceScopedResources // []) |
              map(.resources // [] | .[]) | flatten |
              map(. as $res |
                (.rules // []) |
                map(select(.Status == "fail")) |
                map({
                  resource: $res.name,
                  policy:   $pol.name,
                  rule:     .Name,
                  severity: .Severity,
                  message:  .Message
                })
              ) | flatten
            ) | flatten | .[]
          ' report.json > violations.json 2>/dev/null || echo '[]' > violations.json

          COUNT=$(jq -s 'length' violations.json 2>/dev/null || echo 0)
          echo "violations_count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [[ "${COUNT}" -gt 0 ]]; then
            echo "violations_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "violations_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write job summary
        if: always()
        run: |
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/workflows/install-remediator.yml"

          {
            echo "## Helm Policy Scan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Chart  | \`${CHART_PATH}\` |"
            echo "| Policies | \`${POLICIES_BRANCH}:${POLICIES_PATH}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Build the NCH exception URL for this repository
          ENCODED_REPO=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${POLICIES_REPO}', safe=''))")
          NCH_EXCEPTION_URL="${NIRMATA_URL}/webclient/#clusters/policyReport/repositoryDetails?repo=${ENCODED_REPO}&backurl=clustersPolicyReport%2Frepositories&filter.status.value=fail"

          if [[ "${{ steps.parse.outputs.violations_found }}" == "true" ]]; then
            {
              echo "### ❌ ${{ steps.parse.outputs.violations_count }} violation(s) detected"
              echo ""
              echo "For each violation, choose an action:"
              echo "- **▶ Fix** — triggers the remediator agent to open a PR with an automated fix"
              echo "- **🔒 Exception** — opens NCH where you can log in and request a policy exception"
              echo ""
              echo "| Violation | Policy | Rule | Severity | Actions |"
              echo "|---|---|---|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"

            jq -r '.resource + "\t" + .policy + "\t" + .rule + "\t" + .severity' \
              violations.json 2>/dev/null | \
              while IFS=$'\t' read -r res pol rule sev; do
                res="$(echo "$res" | xargs)"
                pol="$(echo "$pol" | xargs)"
                rule="$(echo "$rule" | xargs)"
                sev="$(echo "$sev" | xargs)"

                # Map policy name to the dropdown choice in install-remediator.yml
                case "${pol}" in
                  *seccomp*)   label="Seccomp violations" ;;
                  *resource*|*limit*|*request*) label="Resource limit violations" ;;
                  *)           label="All violations" ;;
                esac

                echo "| \`${res}\` | \`${pol}\` | \`${rule}\` | ${sev} | [▶ Fix](${WORKFLOW_URL}) · [🔒 Exception](${NCH_EXCEPTION_URL}) |" \
                  >> "$GITHUB_STEP_SUMMARY"
              done

            {
              echo ""
              echo "---"
              echo "### How to act on a violation"
              echo ""
              echo "#### Option 1 — Automated fix (opens a PR)"
              echo "1. Click **▶ Fix** for the violation you want to fix"
              echo "2. Click **Run workflow** (top-right of the remediator page)"
              echo "3. Select the matching **Policy group** from the dropdown"
              echo "4. Click **Run workflow** — the agent creates a PR with the fix"
              echo ""
              echo "| Policy group | Fixes |"
              echo "|---|---|"
              echo "| **Seccomp violations** | \`restrict-seccomp-strict\` — adds \`seccompProfile: RuntimeDefault\` |"
              echo "| **Resource limit violations** | \`require-requests-limits\` — adds CPU/memory requests and limits |"
              echo "| **All violations** | Fixes both in separate PRs |"
              echo ""
              echo "#### Option 2 — Policy exception (via NCH)"
              echo "1. Click **🔒 Exception** for the violation you want to exempt"
              echo "2. Log in to NCH when prompted"
              echo "3. Select the violation and submit an exception request"
              echo "4. Once approved, the exception will be applied and future scans will pass"
            } >> "$GITHUB_STEP_SUMMARY"

          else
            echo "### ✅ No violations found — chart is compliant" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail pipeline on violations
        if: steps.parse.outputs.violations_found == 'true'
        run: |
          echo "::error::Helm policy scan failed: ${{ steps.parse.outputs.violations_count }} violation(s) found in ${CHART_PATH}. See job summary to fix violations or request policy exceptions."
          exit 1
