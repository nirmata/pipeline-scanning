# Scans the Helm chart on helm-app branch against custom policies
# from the kyverno-policies branch (policies/seccomp, policies/resource-limits).
# Publishes results to NCH, then shows per-violation action buttons:
#   ▶ Fix           — triggers the remediator agent to open a fix PR
#   🔒 Exception    — links to NCH where the user can request a policy exception
#
# Required secrets: NIRMATA_URL, NIRMATA_TEAM_TOKEN
# Optional: run manually via workflow_dispatch

name: Helm Policy Scan

on:
  push:
    branches: [helm-app]
  workflow_dispatch:

concurrency:
  group: helm-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHART_PATH: charts/my-nginx-chart
  POLICIES_REPO: https://github.com/nirmata/pipeline-scanning
  POLICIES_BRANCH: kyverno-policies
  NIRMATA_URL: ${{ vars.NIRMATA_URL }}
  NIRMATA_TOKEN: ${{ secrets.NIRMATA_USER_TOKEN }}
  REMEDIATION_WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/workflows/install-remediator.yml

jobs:
  scan:
    name: Scan Helm chart for policy violations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Install nctl
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/nctl \
            https://github.com/nirmata/pipeline-scanning/releases/download/nctl-fix-helm-exceptions/nctl-linux-amd64
          chmod +x /usr/local/bin/nctl
          echo /usr/local/bin >> "${GITHUB_PATH}"
          nctl version

      - name: Login to Nirmata as a DevOps User
        run: |
          # echo "Running with user token..."
          # nctl version
          nctl login nch \
            --userid ${{ vars.NIRMATA_USERID }} \
            --token ${{ secrets.NIRMATA_USER_TOKEN }} \
            --url ${{ vars.NIRMATA_URL }}         

      # - name: Install nctl
      #   run: |
      #     set -euo pipefail
      #     curl -fsSL https://downloads.nirmata.io/nctl/install.sh | NCTL_VERSION=4.10.17 bash
      #     echo "$(dirname "$(command -v nctl)")" >> "${GITHUB_PATH}"
      #     nctl version

      # - name: Scan Helm chart
      #   id: scan
      #   continue-on-error: true
      #   run: |
      #     set -euo pipefail
      #     git clone --no-checkout --depth=1 --filter=blob:none \
      #       --branch kyverno-policies \
      #       https://github.com/nirmata/pipeline-scanning.git pipeline-scanning
      #     cd pipeline-scanning
      #     git sparse-checkout init --cone
      #     git sparse-checkout set policies
      #     git checkout HEAD
      #     cd ..
      #     nctl scan helm -r "${CHART_PATH}" \
      #       -p "pipeline-scanning/policies/baseline" \
      #       -p "pipeline-scanning/policies/restricted" \
      #       -p "pipeline-scanning/policies/seccomp" \
      #       -p "pipeline-scanning/policies/resource-limits" \
      #       -o json \
      #       | tee report.json

      # - name: Publish scan results to NCH
      #   if: always()
      #   continue-on-error: true
      #   timeout-minutes: 5
      #   run: |
      #     TOKEN="${{ secrets.NIRMATA_TEAM_TOKEN }}"
      #     if [[ -z "${TOKEN}" ]]; then
      #       echo "NIRMATA_TEAM_TOKEN secret is not set — skipping NCH publish."
      #       exit 0
      #     fi
      #     nctl login --url "${NIRMATA_URL}" --userid "${{ vars.NIRMATA_USERID }}" --token "${{ secrets.NIRMATA_USER_TOKEN }}"
      #     nctl scan repository \
      #       --policies="pipeline-scanning/policies" \
      #       --publish-token "${TOKEN}"

      - name: Show workspace files (debug)
        run: |
          sudo apt-get install -y tree 2>/dev/null || true
          echo "=== Workspace ==="
          tree "${GITHUB_WORKSPACE}" || find "${GITHUB_WORKSPACE}" -not -path '*/.git/*'
          echo "=== nctl config/temp dirs ==="
          tree "${HOME}/.nirmata" 2>/dev/null || echo "(nctl dirs not yet created)"

      - name: Clean nctl tmp dir
        run: rm -rf "${HOME}/.nirmata/nctl/tmp"

      - name: Run nctl scan (PodSecurity)
        run: |
          set +e
          echo "=== Starting nctl scan ==="
          nctl scan repository --policy-sets pss-baseline,pss-restricted --url ${{ vars.NIRMATA_URL }} --token ${{ secrets.NIRMATA_TEAM_TOKEN }} --publish
          status=$?
          set -e

          echo "=== nctl scan completed with status: $status ==="

          if [ $status -ne 0 ] && [ $status -ne 1 ]; then
            echo "nctl scan failed with (status $status)"
            exit $status
          fi

          echo "nctl completed (status $status). Violations may exist but workflow continues."      

      - name: Parse violations
        id: parse
        if: always() && hashFiles('report.json') != ''
        run: |
          set -euo pipefail

          jq -r '
            .policies // [] |
            map(. as $pol |
              (.namespaceScopedResources // []) |
              map(.resources // [] | .[]) | flatten |
              map(. as $res |
                (.rules // []) |
                map(select(.Status == "fail")) |
                map({
                  resource: $res.name,
                  policy:   $pol.name,
                  rule:     .Name,
                  severity: .Severity,
                  message:  .Message
                })
              ) | flatten
            ) | flatten | .[]
          ' report.json > violations.json

          COUNT=0
          if [[ -s violations.json ]]; then
            COUNT=$(jq -s 'length' violations.json)
          fi
          echo "violations_count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [[ "${COUNT}" -gt 0 ]]; then
            echo "violations_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "violations_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write job summary
        if: always()
        run: |
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/workflows/install-remediator.yml"

          {
            echo "## Helm Policy Scan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Chart  | \`${CHART_PATH}\` |"
            echo "| Policies | \`${POLICIES_BRANCH}:policies/{baseline,restricted,seccomp,resource-limits}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Build the NCH findings URL for this repository (works for any repo name).
          # For nirmata.io (cloud SaaS), the webclient is served from www.nirmata.io.
          # A server-side redirect from nirmata.io/webclient/ → www.nirmata.io/webclient/
          # drops the hash fragment, so we link directly to www.nirmata.io to avoid it.
          # Enterprise installs use NIRMATA_URL as-is (no www. redirect).
          REPO_URL="https://github.com/${{ github.repository }}"
          ENCODED_REPO=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${REPO_URL}', safe=''))")
          if [[ "${NIRMATA_URL}" =~ ://nirmata\.io(/|$) ]]; then
            WEBCLIENT_BASE="https://www.nirmata.io"
          else
            WEBCLIENT_BASE="${NIRMATA_URL}"
          fi
          NCH_EXCEPTION_URL="${WEBCLIENT_BASE}/webclient/#policy-reports/repositories/${ENCODED_REPO}/findings"
          NCH_LOGIN_URL="${NIRMATA_URL}/security/"

          if [[ "${{ steps.parse.outputs.violations_found }}" == "true" ]]; then
            {
              echo "### ❌ ${{ steps.parse.outputs.violations_count }} violation(s) detected"
              echo ""
              echo "For each violation, choose an action:"
              echo "- **🛠️ Fix a violation** — triggers the remediator agent to open a PR with an automated fix"
              echo "- **📋 File an Exception** — opens the NCH findings page for this repository so developers can file policyexceptions for their violations"
              echo ""
              echo "| Violation | Policy | Rule | Severity | Actions |"
              echo "|---|---|---|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"

            jq -r '.resource + "\t" + .policy + "\t" + .rule + "\t" + .severity' \
              violations.json 2>/dev/null | \
              while IFS=$'\t' read -r res pol rule sev; do
                res="$(echo "$res" | xargs)"
                pol="$(echo "$pol" | xargs)"
                rule="$(echo "$rule" | xargs)"
                sev="$(echo "$sev" | xargs)"

                echo "| \`${res}\` | \`${pol}\` | \`${rule}\` | ${sev} | [🛠️ Fix a violation](${WORKFLOW_URL}) &nbsp;**OR**&nbsp; [📋 File an Exception](${NCH_EXCEPTION_URL}) |" \
                  >> "$GITHUB_STEP_SUMMARY"
              done

            {
              echo ""
              echo "---"
              echo "### How to act on a violation"
              echo ""
              echo "#### Option 1 — 🛠️ Fix a violation (opens a PR)"
              echo "1. Click **🛠️ Fix a violation** for the violation you want to fix"
              echo "2. Click **Run workflow** (top-right of the remediator page)"
              echo "3. Select the matching **Policy group** from the dropdown"
              echo "4. Click **Run workflow** — the agent creates a PR with the fix"
              echo ""
              echo "| Policy group | Policies covered |"
              echo "|---|---|"
              echo "| **Seccomp violations** | \`restrict-seccomp-strict\` |"
              echo "| **Resource limit violations** | \`require-requests-limits\` |"
              echo "| **PSS Restricted violations** | \`disallow-capabilities-strict\`, \`disallow-privilege-escalation\`, \`require-run-as-non-root-user\`, \`require-run-as-nonroot\`, \`restrict-volume-types\` |"
              echo "| **All violations** | All of the above |"
              echo ""
              echo "#### Option 2 — 📋 File an Exception (via NCH)"
              echo "1. Click **📋 File an Exception** — you will land directly on the findings page for this repository"
              echo "2. Select the violation and submit an exception request"
              echo "3. Once approved, the exception will be applied and future scans will pass"
            } >> "$GITHUB_STEP_SUMMARY"

          else
            echo "### ✅ No violations found — chart is compliant" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail pipeline on violations
        if: steps.parse.outputs.violations_found == 'true'
        run: |
          echo "::error::Helm policy scan failed: ${{ steps.parse.outputs.violations_count }} violation(s) found in ${CHART_PATH}. See job summary to fix violations or request policy exceptions."
          exit 1

