# Scans the Helm chart against custom Kyverno policies from the kyverno-policies branch.
# Publishes results to NCH, then shows per-violation action links in job output:
#   Fix          — triggers the remediator child pipeline to open a fix MR
#   Exception    — links to NCH where the user can request a policy exception
#
# Required CI/CD variables (set in GitLab project Settings > CI/CD > Variables):
#   NIRMATA_URL          — Nirmata endpoint URL (e.g. https://nirmata.io)
#   NIRMATA_TEAM_TOKEN   — Nirmata team token (masked)
#
# Optional CI/CD variable:
#   POLICY_GROUP   — which violations to fix when triggering the remediator manually
#                    values: "All violations" | "Seccomp violations" | "Resource limit violations"
#                    (defaults to "All violations")

variables:
  CHART_PATH: "charts/my-nginx-chart"
  POLICIES_BRANCH: "kyverno-policies"
  POLICIES_PATH: "policies"
  GIT_DEPTH: "0"
  # POLICY_GROUP: shown as a dropdown on the "Run pipeline" page.
  # Only used when manually triggering the remediator pipeline.
  POLICY_GROUP:
    value: "All violations"
    description: "Which policy group to fix (used only when manually triggering the remediator pipeline)"
    options:
      - "All violations"
      - "Seccomp violations"
      - "Resource limit violations"

stages:
  - scan
  - remediate

# ─────────────────────────────────────────────────────────────────────────────
# Stage 1: scan
# ─────────────────────────────────────────────────────────────────────────────
helm-policy-scan:
  stage: scan
  image: ubuntu:22.04
  timeout: 20 minutes
  rules:
    # Only run the scan automatically on pushes to helm-app and on schedules.
    # Manual web/api triggers skip the scan and go straight to the remediator
    # (so the "Fix a violation" link runs the remediator only, not the full scan).
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "helm-app"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git jq python3 unzip
  script:
    # Install Helm
    - |
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      helm version

    # Install nctl (pinned to 4.10.14 — 4.10.17 has a regression in publish-token auth)
    - |
      curl -fsSL https://nirmata-downloads.s3.us-east-2.amazonaws.com/nctl/nctl_4.10.14/nctl_4.10.14_linux_amd64.zip -o /tmp/nctl.zip
      unzip -q /tmp/nctl.zip -d /usr/local/bin
      chmod +x /usr/local/bin/nctl
      nctl version

    # Fetch policies from kyverno-policies branch of this repo
    - |
      git fetch origin "$POLICIES_BRANCH"
      git archive "origin/$POLICIES_BRANCH" "$POLICIES_PATH/" | tar -x
      echo "Policies fetched:"
      find "$POLICIES_PATH" -type f

    # Scan the Helm chart against the fetched policies
    - |
      export PATH="$PATH:$(dirname "$(command -v nctl)" 2>/dev/null || echo /usr/local/bin)"

      SCAN_EXIT=0
      nctl scan helm -r "$CHART_PATH" \
        -p "$POLICIES_PATH/seccomp" \
        -p "$POLICIES_PATH/resource-limits" \
        -o json | tee report.json || SCAN_EXIT=$?
      echo "SCAN_EXIT=$SCAN_EXIT" > scan-meta.env

    # Publish scan results to NCH (optional, non-fatal)
    # Uses --publish-token (the canonical flag per the NCH "Add Repository"
    # wizard) instead of --token. The team token must have report-publish
    # permission on NCH, which a generic API token does not get.
    - |
      export PATH="$PATH:$(dirname "$(command -v nctl)" 2>/dev/null || echo /usr/local/bin)"
      if [ -z "${NIRMATA_TEAM_TOKEN:-}" ]; then
        echo "NIRMATA_TEAM_TOKEN not set — skipping NCH publish."
      else
        nctl login --url "$NIRMATA_URL" --userid "sagarkundral777@gmail.com" --token "$NIRMATA_USER_TOKEN"
        nctl scan repository ./ \
            --publish-token "$NIRMATA_TEAM_TOKEN" \
            --policies="${POLICIES_PATH}" \
          || echo "WARNING: NCH publish failed — continuing so the violation summary is still shown."
      fi

    # Parse violations from the scan report
    - |
      jq -r '
        .policies // [] |
        map(. as $pol |
          (.namespaceScopedResources // []) |
          map(.resources // [] | .[]) | flatten |
          map(. as $res |
            (.rules // []) |
            map(select(.Status == "fail")) |
            map({
              resource: $res.name,
              policy:   $pol.name,
              rule:     .Name,
              severity: .Severity,
              message:  .Message
            })
          ) | flatten
        ) | flatten | .[]
      ' report.json > violations.json 2>/dev/null || echo '[]' > violations.json

      COUNT=$(jq -s 'length' violations.json 2>/dev/null || echo 0)
      echo "VIOLATIONS_COUNT=$COUNT"
      if [ "$COUNT" -gt 0 ]; then
        echo "VIOLATIONS_FOUND=true"
      else
        echo "VIOLATIONS_FOUND=false"
      fi

      # Write to dotenv for downstream jobs
      echo "VIOLATIONS_COUNT=$COUNT" >> scan.env
      [ "$COUNT" -gt 0 ] && echo "VIOLATIONS_FOUND=true" >> scan.env || echo "VIOLATIONS_FOUND=false" >> scan.env

    # Print scan summary to job log
    - |
      COUNT=$(grep VIOLATIONS_COUNT scan.env | cut -d= -f2)
      FOUND=$(grep VIOLATIONS_FOUND scan.env | cut -d= -f2)

      # Build links
      PROJECT_URL="${CI_PROJECT_URL}"
      # Pre-select the helm-app branch on the "Run pipeline" page so the
      # POLICY_GROUP dropdown is populated correctly.
      REMEDIATE_URL="${CI_PROJECT_URL}/-/pipelines/new?ref=helm-app"

      ENCODED_REPO=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${PROJECT_URL}', safe=''))")
      if echo "${NIRMATA_URL:-}" | grep -q "://nirmata\.io"; then
        WEBCLIENT_BASE="https://www.nirmata.io"
      else
        WEBCLIENT_BASE="${NIRMATA_URL:-https://nirmata.io}"
      fi
      NCH_EXCEPTION_URL="${WEBCLIENT_BASE}/webclient/#policy-reports/repositories/${ENCODED_REPO}/findings"

      echo ""
      echo "════════════════════════════════════════════════════════════"
      echo "  Helm Policy Scan Summary"
      echo "════════════════════════════════════════════════════════════"
      echo "  Branch  : $CI_COMMIT_BRANCH"
      echo "  Chart   : $CHART_PATH"
      echo "  Policies: $POLICIES_BRANCH/$POLICIES_PATH"
      echo "  Commit  : $CI_COMMIT_SHORT_SHA"
      echo "════════════════════════════════════════════════════════════"

      if [ "$FOUND" = "true" ]; then
        echo ""
        echo "  ❌ $COUNT violation(s) detected"
        echo ""
        echo "  For each violation, choose an action:"
        echo "  🛠  Fix a violation    → Trigger the remediator pipeline (see instructions below)"
        echo "  📋 File an Exception  → $NCH_EXCEPTION_URL"
        echo ""
        echo "  ┌──────────────────────────────────────────────────────"
        echo "  │  VIOLATION REPORT"
        echo "  ├──────────────────────────────────────────────────────"
        printf "  │  %-30s %-30s %-30s %s\n" "RESOURCE" "POLICY" "RULE" "SEVERITY"
        echo "  │  ─────────────────────────────────────────────────"
        jq -r '.resource + "\t" + .policy + "\t" + .rule + "\t" + .severity' violations.json 2>/dev/null | \
          while IFS=$'\t' read -r res pol rule sev; do
            printf "  │  %-30s %-30s %-30s %s\n" "$res" "$pol" "$rule" "$sev"
          done
        echo "  └──────────────────────────────────────────────────────"
        echo ""
        echo "  ════════════════════════════════════════════════════════"
        echo "  HOW TO ACT ON A VIOLATION"
        echo "  ════════════════════════════════════════════════════════"
        echo ""
        echo "  Option 1 — 🛠  Fix a violation (opens a Merge Request)"
        echo ""
        echo "  1. Open: ${REMEDIATE_URL}"
        echo "     (the 'helm-app' branch is pre-selected for you)"
        echo "  2. Use the POLICY_GROUP dropdown to choose what to fix:"
        echo "       'All violations'              — fixes both seccomp + resource limits in one MR"
        echo "       'Seccomp violations'          — adds seccompProfile: RuntimeDefault"
        echo "       'Resource limit violations'   — adds CPU/memory requests and limits"
        echo "  3. Click 'New pipeline'"
        echo "  4. The remediator runs automatically (the scan job is skipped on manual runs)"
        echo "     and creates an MR with the fix."
        echo ""
        echo "  Option 2 — 📋 File an Exception (via NCH)"
        echo ""
        echo "  1. Open: $NCH_EXCEPTION_URL"
        echo "  2. Select the violation and submit an exception request"
        echo "  3. Once approved, future scans will pass"
        echo ""
        echo "  ════════════════════════════════════════════════════════"

        # Fail the pipeline because violations were detected
        exit 1
      else
        echo ""
        echo "  ✅ No violations found — chart is compliant"
        echo ""
      fi

  artifacts:
    when: always
    paths:
      - report.json
      - violations.json
      - scan.env
    reports:
      dotenv: scan.env
    expire_in: 7 days

# ─────────────────────────────────────────────────────────────────────────────
# Stage 2: remediate
# Auto-runs only when the pipeline is started manually from the web UI or API
# (i.e. when the user clicks "Fix a violation" → "New pipeline" with their
# chosen POLICY_GROUP). Does NOT run on regular pushes or schedules — those
# only trigger the scan above.
# ─────────────────────────────────────────────────────────────────────────────
trigger-remediator:
  stage: remediate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
  variables:
    POLICY_GROUP: "$POLICY_GROUP"
  trigger:
    include: remediator-pipeline.yml
    strategy: depend


