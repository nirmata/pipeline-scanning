policies:
  # ── Group entries (all policies in a group) ───────────────────────────────
  - name: seccomp-group
    displayName: "Seccomp violations"
    path: policies/seccomp/
    ref: kyverno-policies
    resourceName: nginx-seccomp-fix
    branchPrefix: remediation-seccomp-

  - name: resource-limits-group
    displayName: "Resource limit violations"
    path: policies/resource-limits/
    ref: kyverno-policies
    resourceName: nginx-resource-limits-fix
    branchPrefix: remediation-resource-limits-

  - name: pss-baseline
    displayName: "Baseline violations"
    path: policies/baseline/
    ref: kyverno-policies
    resourceName: nginx-baseline-fix
    branchPrefix: remediation-baseline-

  - name: pss-restricted
    displayName: "Restricted violations"
    path: policies/restricted/
    ref: kyverno-policies
    resourceName: nginx-restricted-fix
    branchPrefix: remediation-restricted-

  # ── Individual seccomp policies ───────────────────────────────────────────
  - name: restrict-seccomp-strict
    displayName: "restrict-seccomp-strict"
    path: policies/seccomp/restrict-seccomp-strict.yaml
    ref: kyverno-policies
    resourceName: nginx-seccomp-fix
    branchPrefix: remediation-seccomp-

  # ── Individual resource-limits policies ───────────────────────────────────
  - name: require-requests-limits
    displayName: "require-requests-limits"
    path: policies/resource-limits/require_pod_requests_limits.yaml
    ref: kyverno-policies
    resourceName: nginx-resource-limits-fix
    branchPrefix: remediation-resource-limits-

  # ── Individual baseline (PSS) policies ───────────────────────────────────
  - name: disallow-capabilities
    displayName: "disallow-capabilities"
    path: policies/baseline/disallow-capabilities.yaml
    ref: kyverno-policies
    resourceName: nginx-baseline-fix
    branchPrefix: remediation-baseline-

  - name: disallow-host-namespaces
